<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Элдория RPG</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #0a0a0a;
  color: #e0e0e8;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
#game-wrap { position: relative; box-shadow: 0 0 40px rgba(240,200,90,0.3); }
#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #1a1a2a; border: 2px solid #f0c85a; }
.hud { position: absolute; pointer-events: none; }
#hud-top { top: 8px; left: 8px; right: 8px; display: flex; gap: 8px; align-items: flex-start; }
.bar { background: #0a0a0a; border: 2px solid #2a2a3a; padding: 4px 8px; font-size: 11px; min-width: 160px; position: relative; }
.bar .fill { height: 8px; background: #c23a3a; margin-top: 4px; transition: width 0.2s; }
.bar.mp .fill { background: #3a8ad8; }
.bar.xp .fill { background: #f0c85a; }
.bar .label { font-size: 10px; color: #a0a0a8; }
.bar .value { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; font-weight: bold; text-shadow: 1px 1px 0 #000; margin-top: 4px; }
#minimap-wrap { position: absolute; top: 8px; right: 8px; background: #0a0a0a; border: 2px solid #f0c85a; padding: 2px; }
#minimap { display: block; image-rendering: pixelated; }
#hud-bottom { bottom: 8px; left: 8px; right: 8px; display: flex; gap: 8px; justify-content: space-between; font-size: 11px; color: #8a8a9a; flex-wrap: wrap; }
.key-hint { background: #1a1a2a; padding: 2px 6px; border: 1px solid #2a2a3a; }
.modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a2a; border: 3px solid #f0c85a; box-shadow: 0 0 20px rgba(0,0,0,0.8); padding: 20px; min-width: 320px; max-width: 90%; display: none; z-index: 10; }
.modal.active { display: block; }
.modal h2 { margin: 0 0 12px; color: #f0c85a; font-size: 16px; text-align: center; text-transform: uppercase; }
.modal p { font-size: 12px; line-height: 1.5; margin: 6px 0; }
.modal button { background: #2a2a3a; border: 2px solid #f0c85a; color: #e0e0e8; padding: 6px 12px; font-family: inherit; font-size: 12px; cursor: pointer; margin: 4px; }
.modal button:hover { background: #3a3a4a; color: #f0c85a; }
.class-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0; }
.class-card { background: #2a2a3a; border: 2px solid #4a4a5a; padding: 8px; cursor: pointer; text-align: center; transition: all 0.2s; }
.class-card:hover { border-color: #f0c85a; background: #3a3a4a; }
.class-card.selected { border-color: #5aff8a; background: #2a3a2a; }
.class-card img { width: 64px; height: 64px; image-rendering: pixelated; display: block; margin: 0 auto; }
.class-card .name { font-size: 11px; margin-top: 4px; }
.class-card .stats { font-size: 9px; color: #8a8a9a; }
.inv-grid { display: grid; grid-template-columns: repeat(5, 48px); gap: 4px; margin: 8px 0; justify-content: center; }
.inv-slot { width: 48px; height: 48px; background: #1a1a2a; border: 2px solid #4a4a5a; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
.inv-slot:hover { border-color: #f0c85a; }
.inv-slot img { width: 40px; height: 40px; image-rendering: pixelated; }
.inv-slot .rarity { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; }
.rarity.common { background: #8a8a9a; }
.rarity.rare { background: #4a8aff; }
.rarity.epic { background: #a85aff; }
.rarity.legendary { background: #f0c85a; }
.equip-slots { display: flex; gap: 16px; margin: 12px 0; justify-content: center; }
.equip-slot { width: 48px; height: 48px; background: #1a1a2a; border: 2px solid #6a6a7a; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
.equip-slot img { width: 40px; height: 40px; image-rendering: pixelated; }
.equip-slot .slot-label { position: absolute; bottom: -14px; font-size: 9px; color: #8a8a9a; width: 100%; text-align: center; }
.btn-close { position: absolute; top: 4px; right: 4px; background: #8a2a2a; border: 1px solid #c23a3a; color: #fff; width: 22px; height: 22px; font-size: 14px; cursor: pointer; padding: 0; line-height: 1; }
.quest-item { background: #2a2a3a; padding: 8px; margin: 4px 0; border-left: 3px solid #f0c85a; font-size: 11px; }
.quest-item.done { border-left-color: #5aff8a; opacity: 0.7; }
.toast { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: #1a1a2a; border: 2px solid #f0c85a; padding: 8px 16px; font-size: 12px; animation: toast-in 0.3s ease-out; pointer-events: none; z-index: 20; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
#dmg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 5; }
.float-text { position: absolute; font-weight: bold; font-size: 14px; text-shadow: 2px 2px 0 #000; animation: float-up 0.8s ease-out forwards; }
@keyframes float-up { to { transform: translateY(-30px); opacity: 0; } }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="640" height="480"></canvas>
  <div id="hud-top" class="hud">
    <div>
      <div class="bar hp"><div class="label">HP</div><div class="fill" id="hp-fill" style="width:100%"></div><div class="value" id="hp-val">100/100</div></div>
      <div class="bar mp" style="margin-top:4px"><div class="label">MP</div><div class="fill" id="mp-fill" style="width:100%"></div><div class="value" id="mp-val">20/20</div></div>
    </div>
    <div class="bar xp"><div class="label" id="lvl-label">LVL 1</div><div class="fill" id="xp-fill" style="width:0%"></div><div class="value" id="xp-val">0/100</div></div>
    <div style="margin-left:auto;font-size:12px;background:#1a1a2a;padding:6px 10px;border:2px solid #f0c85a">🪙 <span id="gold-val">0</span></div>
  </div>
  <div id="minimap-wrap" class="hud"><canvas id="minimap" width="120" height="90"></canvas></div>
  <div id="hud-bottom" class="hud">
    <span><span class="key-hint">WASD/↑↓←→</span> движение</span>
    <span><span class="key-hint">SPACE</span> атака</span>
    <span><span class="key-hint">E</span> говорить</span>
    <span><span class="key-hint">I</span> инвентарь</span>
    <span><span class="key-hint">Q</span> квесты</span>
  </div>
  <div id="dmg-layer"></div>

  <div id="start-modal" class="modal active">
    <h2>⚔ Элдория ⚔</h2>
    <p style="text-align:center;color:#a0a0a8">Выбери свой класс</p>
    <div class="class-grid" id="class-grid"></div>
    <div style="text-align:center"><button id="start-btn">Начать приключение</button></div>
  </div>

  <div id="inv-modal" class="modal">
    <button class="btn-close" data-close="inv-modal">×</button>
    <h2>Инвентарь</h2>
    <p style="text-align:center;color:#8a8a9a;font-size:10px">Экипировка</p>
    <div class="equip-slots">
      <div class="equip-slot" data-slot="head"><span class="slot-label">Шлем</span></div>
      <div class="equip-slot" data-slot="chest"><span class="slot-label">Броня</span></div>
      <div class="equip-slot" data-slot="weapon"><span class="slot-label">Оружие</span></div>
    </div>
    <p style="text-align:center;color:#8a8a9a;font-size:10px;margin-top:20px">Предметы</p>
    <div class="inv-grid" id="inv-grid"></div>
    <p style="font-size:10px;color:#6a6a7a;text-align:center">Клик — экипировать/использовать</p>
  </div>

  <div id="quest-modal" class="modal">
    <button class="btn-close" data-close="quest-modal">×</button>
    <h2>Журнал квестов</h2>
    <div id="quest-list"></div>
  </div>

  <div id="dialogue-modal" class="modal">
    <h2 id="dialogue-name">NPC</h2>
    <p id="dialogue-text"></p>
    <div id="dialogue-actions" style="text-align:center"></div>
  </div>

  <div id="gameover-modal" class="modal">
    <h2 style="color:#ff5a5a">☠ Вы погибли ☠</h2>
    <p id="death-stats" style="text-align:center"></p>
    <div style="text-align:center;margin-top:12px"><button id="restart-btn">Начать заново</button></div>
  </div>

  <div id="victory-modal" class="modal">
    <h2 style="color:#5aff8a">🏆 Победа! 🏆</h2>
    <p style="text-align:center">Вы победили дракона!</p>
    <p id="victory-stats" style="text-align:center"></p>
    <div style="text-align:center;margin-top:12px"><button id="victory-restart-btn">Играть снова</button></div>
  </div>
</div>

const IMG = {};
let spritesReady = false;

async function loadAllSprites() {
  const promises = Object.entries(SPRITES).map(([name, svg]) => {
    return new Promise((resolve) => {
      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { IMG[name] = img; URL.revokeObjectURL(url); resolve(); };
      img.onerror = () => { console.warn('Failed:', name); resolve(); };
      img.src = url;
    });
  });
  await Promise.all(promises);
  spritesReady = true;
}

// COLLISION
// ============================================================
function tileBlocked(x, y) {
  if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return true;
  if (map[y][x] === 'water') return true;
  for (const b of buildings) if (x >= b.gx && x < b.gx + b.w && y >= b.gy && y < b.gy + b.h) return true;
  return false;
}

function entityAt(x, y) {
  for (const e of entities) {
    if (!e.alive) continue;
    if (e.w === 2) { if (x >= e.gx && x < e.gx + 2 && y >= e.gy && y < e.gy + 2) return e; }
    else if (e.gx === x && e.gy === y) return e;
  }
  return null;
}

function tryMovePlayer(dx, dy) {
  if (player.moving) return;
  const nx = player.gx + dx, ny = player.gy + dy;
  if (tileBlocked(nx, ny)) return;
  if (entityAt(nx, ny)) return;
  player.gx = nx; player.gy = ny;
  player.startX = player.x; player.startY = player.y;
  player.targetX = nx * TILE; player.targetY = ny * TILE;
  player.moving = true; player.moveTimer = 0;
}

// ============================================================
// COMBAT
// ============================================================
function attack() {
  if (!player || player.attackCooldown > 0) return;
  player.attackCooldown = 350;
  for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
    const ent = entityAt(player.gx + dx, player.gy + dy);
    if (ent && ent.type === 'enemy' && ent.alive) {
      dealDamageTo(ent);
      spawnHitFx((player.gx + dx) * TILE + TILE / 2, (player.gy + dy) * TILE + TILE / 2);
      return;
    }
  }
}

function dealDamageTo(enemy) {
  const atk = player.atk + (player.equipment.weapon?.atk || 0);
  const dmg = Math.max(1, atk - enemy.def + Math.floor(Math.random() * 5));
  enemy.hp -= dmg;
  addFloat(enemy.gx * TILE + TILE / 2, enemy.gy * TILE, `-${dmg}`, '#ff5a5a');
  if (enemy.hp <= 0) killEnemy(enemy);
}

function killEnemy(enemy) {
  enemy.alive = false;
  player.gold += enemy.goldReward;
  addFloat(enemy.gx * TILE + TILE / 2, enemy.gy * TILE - 20, `+${enemy.goldReward}🪙`, '#f0c85a');
  gainXp(enemy.xpReward);
  for (const q of player.quests) {
    if (!q.done && q.type === 'kill' && q.enemyType === enemy.subtype) {
      q.progress++;
      if (q.progress >= q.target) { q.done = true; showToast('Квест выполнен! Вернитесь к старейшине'); }
    }
  }
  if (enemy.subtype === 'goblin' && Math.random() < 0.4) { player.inventory.push(makeItem('helmet')); showToast('Выпал шлем!'); }
  else if (enemy.subtype === 'wolf' && Math.random() < 0.4) { player.inventory.push(makeItem('potion')); showToast('Выпало зелье!'); }
  else if (enemy.subtype === 'skeleton' && Math.random() < 0.5) { player.inventory.push(makeItem('sword')); showToast('Выпал меч!'); }

  if (enemy.isBoss) {
    gameState = 'victory';
    document.getElementById('victory-stats').textContent = `Уровень ${player.level} · ${player.gold} золота`;
    document.getElementById('victory-modal').classList.add('active');
  }
}

function gainXp(amount) {
  player.xp += amount;
  while (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.floor(player.xpNext * 1.5);
    player.hpMax += 15; player.hp = player.hpMax;
    player.mpMax += 10; player.mp += 10;
    player.atk += 2; player.def += 1;
    addFloat(player.x + TILE / 2, player.y - 20, 'LEVEL UP!', '#ffe08a');
    showToast(`Уровень ${player.level}!`);
  }
}

function enemyAttackPlayer(enemy) {
  if (player.invulnTimer > 0) return;
  const pdef = player.def + (player.equipment.head?.def || 0) + (player.equipment.chest?.def || 0);
  const dmg = Math.max(1, enemy.atk - pdef + Math.floor(Math.random() * 3));
  player.hp -= dmg;
  player.invulnTimer = 500;
  addFloat(player.x + TILE / 2, player.y - 10, `-${dmg}`, '#ff5a5a');
  if (player.hp <= 0) {
    player.hp = 0;
    gameState = 'dead';
    document.getElementById('death-stats').textContent = `Уровень ${player.level} · ${player.gold} золота`;
    document.getElementById('gameover-modal').classList.add('active');
  }
}

// ============================================================
// ITEMS
// ============================================================
const ITEMS = {
  helmet: { name: 'Шлем', slot: 'head', def: 5, rarity: 'common', sprite: 'helmet' },
  chest: { name: 'Броня', slot: 'chest', def: 10, rarity: 'common', sprite: 'chest_armor' },
  sword: { name: 'Меч', slot: 'weapon', atk: 6, rarity: 'common', sprite: 'sword' },
  potion: { name: 'Зелье', slot: null, rarity: 'common', sprite: 'potion',
    use: () => { player.hp = Math.min(player.hpMax, player.hp + 50); addFloat(player.x + TILE / 2, player.y - 20, '+50', '#5aff8a'); } },
};

function makeItem(key) { return { key, ...ITEMS[key], id: Math.random().toString(36).slice(2) }; }

// ============================================================
// QUESTS
// ============================================================
const QUEST_DEFS = {
  q_goblins: { id: 'q_goblins', name: 'Убить гоблинов', desc: 'Убей 3 гоблина на восточной тропе',
    type: 'kill', enemyType: 'goblin', target: 3, xpReward: 100, goldReward: 50 },
};

function acceptQuest(id) {
  if (player.quests.find(q => q.id === id)) return;
  player.quests.push({ ...QUEST_DEFS[id], progress: 0, done: false, completed: false });
  showToast('Квест принят: ' + QUEST_DEFS[id].name);
}

function completeQuest(id) {
  const q = player.quests.find(q => q.id === id);
  if (!q || q.completed) return;
  q.done = true; q.completed = true;
  gainXp(q.xpReward);
  player.gold += q.goldReward;
  showToast(`Квест завершён! +${q.xpReward} XP, +${q.goldReward} золота`);
}

// ============================================================
// INPUT
// ============================================================
document.addEventListener('keydown', (e) => {
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  if (gameState !== 'playing') return;
  const k = e.key.toLowerCase();
  if (['arrowup', 'w'].includes(k)) tryMovePlayer(0, -1);
  else if (['arrowdown', 's'].includes(k)) tryMovePlayer(0, 1);
  else if (['arrowleft', 'a'].includes(k)) tryMovePlayer(-1, 0);
  else if (['arrowright', 'd'].includes(k)) tryMovePlayer(1, 0);
  else if (k === ' ') attack();
  else if (k === 'e') interact();
  else if (k === 'i') toggleModal('inv-modal');
  else if (k === 'q') toggleModal('quest-modal');
  else if (k === 'escape') closeAllModals();
});

function interact() {
  for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
    const ent = entityAt(player.gx + dx, player.gy + dy);
    if (ent && ent.type === 'npc') { openDialogue(ent); return; }
  }
  showToast('Рядом никого нет');
}

// ============================================================
// DIALOGUE
// ============================================================
function openDialogue(npc) {
  closeAllModals();
  document.getElementById('dialogue-name').textContent = npc.name;
  let text = npc.dialogue;
  const actions = document.getElementById('dialogue-actions');
  actions.innerHTML = '';

  if (npc.id === 'qg') {
    const hasQuest = player.quests.find(q => q.id === npc.questId);
    if (!hasQuest) {
      const btn = document.createElement('button');
      btn.textContent = 'Принять квест';
      btn.onclick = () => { acceptQuest(npc.questId); closeAllModals(); };
      actions.appendChild(btn);
    } else if (hasQuest.done && !hasQuest.completed) {
      text = `Отлично! Ты убил ${hasQuest.progress}/${hasQuest.target} гоблинов. Вот твоя награда!`;
      const btn = document.createElement('button');
      btn.textContent = 'Завершить квест';
      btn.onclick = () => { completeQuest(npc.questId); closeAllModals(); };
      actions.appendChild(btn);
    } else if (!hasQuest.completed) {
      text = `Прогресс: ${hasQuest.progress}/${hasQuest.target} гоблинов. Продолжай!`;
    } else {
      text = 'Спасибо, герой! Дракон всё ещё ждёт тебя на востоке.';
    }
  }

  document.getElementById('dialogue-text').textContent = text;
  const closeBtn = document.createElement('button');
  closeBtn.textContent = 'Закрыть';
  closeBtn.onclick = closeAllModals;
  actions.appendChild(closeBtn);
  document.getElementById('dialogue-modal').classList.add('active');
}

// ============================================================
// UI HELPERS
// ============================================================
function toggleModal(id) {
  const m = document.getElementById(id);
  if (m.classList.contains('active')) m.classList.remove('active');
  else {
    closeAllModals();
    m.classList.add('active');
    if (id === 'inv-modal') renderInventory();
    if (id === 'quest-modal') renderQuests();
  }
}

function closeAllModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.onclick = () => document.getElementById(btn.dataset.close).classList.remove('active');
});

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('game-wrap').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function addFloat(x, y, text, color) {
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.color = color;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.position = 'absolute';
  document.getElementById('dmg-layer').appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function spawnHitFx(x, y) { particles.push({ x, y, life: 0.3, maxLife: 0.3 }); }

function renderInventory() {
  document.querySelectorAll('.equip-slot').forEach(el => {
    const slot = el.dataset.slot;
    const item = player.equipment[slot];
    const label = slot === 'head' ? 'Шлем' : slot === 'chest' ? 'Броня' : 'Оружие';
    el.innerHTML = `<span class="slot-label">${label}</span>`;
    if (item && IMG[item.sprite]) {
      const img = document.createElement('img');
      img.src = IMG[item.sprite].src;
      el.insertBefore(img, el.firstChild);
      el.onclick = () => { player.inventory.push(item); player.equipment[slot] = null; renderInventory(); };
    } else { el.onclick = null; }
  });

  const grid = document.getElementById('inv-grid');
  grid.innerHTML = '';
  if (player.inventory.length === 0) {
    grid.innerHTML = '<p style="color:#8a8a9a;font-size:11px;grid-column:1/-1;text-align:center">Пусто</p>';
  }
  player.inventory.forEach((item, idx) => {
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    const img = document.createElement('img');
    img.src = IMG[item.sprite].src;
    slot.appendChild(img);
    const rar = document.createElement('div');
    rar.className = 'rarity ' + item.rarity;
    slot.appendChild(rar);
    slot.title = item.name;
    slot.onclick = () => {
      if (item.slot === null) { item.use(); player.inventory.splice(idx, 1); }
      else {
        const cur = player.equipment[item.slot];
        player.equipment[item.slot] = item;
        player.inventory.splice(idx, 1);
        if (cur) player.inventory.push(cur);
      }
      renderInventory();
    };
    grid.appendChild(slot);
  });
}

function renderQuests() {
  const list = document.getElementById('quest-list');
  list.innerHTML = '';
  if (player.quests.length === 0) {
    list.innerHTML = '<p style="color:#8a8a9a;text-align:center">Нет активных квестов</p>';
    return;
  }
  player.quests.forEach(q => {
    const div = document.createElement('div');
    div.className = 'quest-item' + (q.completed ? ' done' : '');
    div.innerHTML = `<strong>${q.name}</strong><br><span style="color:#8a8a9a">${q.desc}</span><br>
      <span style="color:${q.done ? '#5aff8a' : '#f0c85a'}">${q.progress}/${q.target}${q.done ? ' ✓' : ''}</span>`;
    list.appendChild(div);
  });
}

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  gameTime += dt;
  if (gameState !== 'playing') return;

  if (player.moving) {
    player.moveTimer += dt;
    const t = Math.min(1, player.moveTimer / 0.12);
    player.x = player.startX + (player.targetX - player.startX) * t;
    player.y = player.startY + (player.targetY - player.startY) * t;
    if (t >= 1) { player.moving = false; player.x = player.targetX; player.y = player.targetY; }
  }

  player.attackCooldown = Math.max(0, player.attackCooldown - dt * 1000);
  player.invulnTimer = Math.max(0, player.invulnTimer - dt * 1000);

  regenTimer += dt;
  if (regenTimer >= 2) {
    regenTimer = 0;
    if (player.hp < player.hpMax) player.hp = Math.min(player.hpMax, player.hp + 1);
  }

  for (const e of entities) {
    if (!e.alive || e.type !== 'enemy') continue;
    e.cooldown -= dt * 1000;
    if (e.cooldown > 0) continue;
    const dx = player.gx - e.gx, dy = player.gy - e.gy;
    const dist = Math.abs(dx) + Math.abs(dy);
    if (e.w === 2) {
      const adx = Math.max(0, Math.max(e.gx - player.gx, player.gx - (e.gx + 1)));
      const ady = Math.max(0, Math.max(e.gy - player.gy, player.gy - (e.gy + 1)));
      if (adx + ady <= 1) { e.cooldown = 1200; enemyAttackPlayer(e); }
    } else {
      if (dist === 1) { e.cooldown = 1200; enemyAttackPlayer(e); }
      else if (dist <= 5) {
        e.cooldown = 900;
        let nx = e.gx, ny = e.gy;
        if (Math.abs(dx) > Math.abs(dy)) nx += Math.sign(dx); else ny += Math.sign(dy);
        if (!tileBlocked(nx, ny) && !entityAt(nx, ny) && !(player.gx === nx && player.gy === ny)) {
          e.gx = nx; e.gy = ny; e.x = nx * TILE; e.y = ny * TILE;
        }
      }
    }
  }

  particles.forEach(p => p.life -= dt);
  particles = particles.filter(p => p.life > 0);
  updateHud();
}

function updateHud() {
  document.getElementById('hp-fill').style.width = (player.hp / player.hpMax * 100) + '%';
  document.getElementById('hp-val').textContent = `${Math.ceil(player.hp)}/${player.hpMax}`;
  document.getElementById('mp-fill').style.width = (player.mp / player.mpMax * 100) + '%';
  document.getElementById('mp-val').textContent = `${Math.ceil(player.mp)}/${player.mpMax}`;
  document.getElementById('xp-fill').style.width = (player.xp / player.xpNext * 100) + '%';
  document.getElementById('xp-val').textContent = `${player.xp}/${player.xpNext}`;
  document.getElementById('lvl-label').textContent = `LVL ${player.level}`;
  document.getElementById('gold-val').textContent = player.gold;
}

// ============================================================
// RENDER
// ============================================================
function render() {
  if (!spritesReady) {
    ctx.fillStyle = '#1a1a2a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f0c85a'; ctx.font = '16px monospace'; ctx.textAlign = 'center';
    ctx.fillText('Загрузка...', canvas.width / 2, canvas.height / 2);
    return;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const img = IMG[map[y][x]];
      if (img) ctx.drawImage(img, x * TILE, y * TILE, TILE, TILE);
    }
  }

  for (const b of buildings) {
    const img = IMG[b.sprite];
    if (img) ctx.drawImage(img, b.gx * TILE, b.gy * TILE, b.w * TILE, b.h * TILE);
  }

  for (const e of entities) {
    if (!e.alive) continue;
    const img = IMG[e.sprite];
    if (!img) continue;
    const w = e.w === 2 ? TILE * 2 : TILE;
    ctx.drawImage(img, e.gx * TILE, e.gy * TILE, w, w);
    if (e.type === 'enemy' && e.hp < e.hpMax) {
      const bx = e.gx * TILE, by = e.gy * TILE - 6;
      ctx.fillStyle = '#0a0a0a'; ctx.fillRect(bx, by, w, 4);
      ctx.fillStyle = '#ff3a3a'; ctx.fillRect(bx, by, w * (e.hp / e.hpMax), 4);
    }
  }

  if (player && player.hp > 0) {
    if (player.invulnTimer > 0 && Math.floor(gameTime * 20) % 2 === 0) ctx.globalAlpha = 0.5;
    const img = IMG[player.sprite];
    if (img) ctx.drawImage(img, player.x, player.y, TILE, TILE);
    ctx.globalAlpha = 1;
  }

  for (const p of particles) {
    const img = IMG['hit_fx'];
    if (img) {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.drawImage(img, p.x - TILE / 2, p.y - TILE / 2, TILE, TILE);
      ctx.globalAlpha = 1;
    }
  }
  renderMinimap();
}

function renderMinimap() {
  const mw = minimap.width, mh = minimap.height;
  const sx = mw / MAP_W, sy = mh / MAP_H;
  mmCtx.clearRect(0, 0, mw, mh);
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const t = map[y][x];
      mmCtx.fillStyle = t === 'dirt' ? '#8a5a2b' : t === 'water' ? '#3a8ad8' : t === 'stone' ? '#8a8a9a' : '#6ab84a';
      mmCtx.fillRect(x * sx, y * sy, sx + 1, sy + 1);
    }
  }
  for (const b of buildings) { mmCtx.fillStyle = '#c9a24a'; mmCtx.fillRect(b.gx * sx, b.gy * sy, b.w * sx, b.h * sy); }
  for (const e of entities) {
    if (!e.alive) continue;
    if (e.type === 'enemy') { mmCtx.fillStyle = e.isBoss ? '#a85aff' : '#ff3a3a'; mmCtx.fillRect(e.gx * sx, e.gy * sy, Math.max(2, sx), Math.max(2, sy)); }
    else if (e.type === 'npc') { mmCtx.fillStyle = '#5ad8ff'; mmCtx.fillRect(e.gx * sx, e.gy * sy, Math.max(2, sx), Math.max(2, sy)); }
  }
  if (player) { mmCtx.fillStyle = '#5aff8a'; mmCtx.fillRect(player.gx * sx - 1, player.gy * sy - 1, Math.max(3, sx + 2), Math.max(3, sy + 2)); }
}

// ============================================================
// LOOP
// ============================================================
function gameLoop(ts) {
  const dt = Math.min(0.05, (ts - lastTime) / 1000);
  lastTime = ts;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// START
// ============================================================
function renderClassCards() {
  const grid = document.getElementById('class-grid');
  grid.innerHTML = '';
  for (const [key, cls] of Object.entries(CLASSES)) {
    const card = document.createElement('div');
    card.className = 'class-card' + (key === pendingClass ? ' selected' : '');
    card.innerHTML = `<img src="${IMG[cls.sprite].src}" alt="${cls.name}"><div class="name">${cls.name}</div><div class="stats">HP ${cls.hp} · MP ${cls.mp}</div>`;
    card.onclick = () => {
      pendingClass = key;
      document.querySelectorAll('.class-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    };
    grid.appendChild(card);
  }
}

async function startGame() {
  await loadAllSprites();
  renderClassCards();

  document.getElementById('start-btn').onclick = () => {
    document.getElementById('start-modal').classList.remove('active');
    initWorld();
    player = createPlayer(pendingClass);
    gameState = 'playing';
    updateHud();
  };
  document.getElementById('restart-btn').onclick = () => {
    document.getElementById('gameover-modal').classList.remove('active');
    document.getElementById('start-modal').classList.add('active');
    gameState = 'menu';
  };
  document.getElementById('victory-restart-btn').onclick = () => {
    document.getElementById('victory-modal').classList.remove('active');
    document.getElementById('start-modal').classList.add('active');
    gameState = 'menu';
  };

  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}
startGame();
