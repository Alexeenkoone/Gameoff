<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0b08">
<title>Магнат глубин v9.6</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e0b08;--panel:#1c1610;--panel2:#261d12;--brz:#c9a35c;--brz2:#e6c885;--tx:#e8ddc8;--dim:#8f8270;--bd:#3a2f1e;--dgr:#ff5252;--grn:#7ed957;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#17110a,#0b0805);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;display:flex;flex-direction:column;overscroll-behavior:none;}
header{position:sticky;top:0;z-index:40;flex-shrink:0;background:linear-gradient(180deg,#241c12,#1a140c);border-bottom:2px solid var(--bd);padding:calc(5px + env(safe-area-inset-top)) 8px 7px;display:flex;flex-direction:column;gap:5px;}
.stats{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.stats .chip{font-size:11px;padding:2px 6px;}
.chip{background:#0f0b07;border:1px solid var(--bd);border-radius:12px;padding:3px 7px;font-size:12px;white-space:nowrap;}
.chip b{color:var(--brz2);}
nav{display:flex;gap:4px;width:100%;}
.tab{flex:1;padding:8px 2px;text-align:center;font-size:11px;cursor:pointer;background:#0f0b07;border:1px solid var(--bd);border-radius:9px;color:var(--dim);}
.tab.active{background:linear-gradient(180deg,#c9a35c,#9c7b3c);color:#1a1206;font-weight:700;border-color:var(--brz);}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px calc(16px + env(safe-area-inset-bottom));}
.view{display:none;}
.view.active{display:block;}
h2{color:var(--brz2);text-align:center;margin:4px 0 10px;font-size:19px;text-shadow:0 0 12px rgba(201,163,92,.4);}
.scene{max-width:560px;margin:0 auto;border:2px solid #4a3a20;border-radius:16px;background:radial-gradient(ellipse at 50% 0%,#221a10 0%,#120d07 70%);padding:10px 12px 12px;box-shadow:0 0 24px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.5);}
.scene-title{text-align:center;color:var(--brz2);font-weight:700;margin-bottom:8px;font-size:14px;}
#city{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.cell{position:relative;aspect-ratio:1;background:#171208;border:2px dashed #3d2f18;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cell.filled{border-style:solid;border-color:#4d3c1e;background:#1d1509;}
.cell .plus{color:#4d3f26;font-size:20px;font-weight:700;}
.bld{position:absolute;inset:3px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;text-align:center;padding:2px;}
.bld .ico{font-size:20px;}
.bld .lvl{position:absolute;top:2px;right:4px;font-size:9px;background:#000;border:1px solid var(--bd);border-radius:5px;padding:0 4px;color:var(--brz2);}
.bld .pbar{position:absolute;bottom:4px;left:4px;right:4px;height:4px;background:#000;border-radius:2px;overflow:hidden;}
.bld .pbar>i{display:block;height:100%;background:var(--brz);}
/* Здания */
.bld.cityhall{background:linear-gradient(180deg,#4a3a20,#2a1d10);border:1px solid var(--brz);box-shadow:0 0 10px rgba(201,163,92,0.4);}
.bld.mine{background:linear-gradient(180deg,#243018,#171a0d);border:1px solid #4d5c2a;}
.bld.storage{background:linear-gradient(180deg,#332a12,#1d1708);border:1px solid #6a5628;}
.bld.barracks{background:linear-gradient(180deg,#331c12,#1d0f08);border:1px solid #6a3c28;}
.bld.range{background:linear-gradient(180deg,#2a3318,#171a0d);border:1px solid #5c6a28;}
.bld.workshop{background:linear-gradient(180deg,#33251c,#1d130d);border:1px solid #6a4c38;}
.bld.sawmill{background:linear-gradient(180deg,#2e2216,#19120b);border:1px solid #614b32;}
.bld.forge{background:linear-gradient(180deg,#3a1c0e,#200d05);border:1px solid #7a4020;}
.bld.vent{background:linear-gradient(180deg,#1a2430,#0d1218);border:1px solid #3c5468;}
.bld.altar{background:linear-gradient(180deg,#2c1a33,#170d1d);border:1px solid #5c3c68;}

.spark{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff;z-index:5;cursor:pointer;animation:pu 1.1s infinite alternate;}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.35)}}
.card{background:linear-gradient(180deg,#221a10,#181209);border:1px solid var(--bd);border-radius:14px;padding:12px;max-width:460px;margin:0 auto 12px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.5);}
.card h3{margin:0 0 5px;color:var(--brz2);}
.card .sub{color:var(--dim);font-size:12.5px;margin-bottom:6px;}
.bar2{height:9px;background:#0d0a06;border:1px solid var(--bd);border-radius:5px;overflow:hidden;margin:7px 0;}
.bar2>i{display:block;height:100%;background:linear-gradient(90deg,#9c7b3c,#e6c885);transition:width .3s;}
.btn{background:linear-gradient(180deg,#c9a35c,#9c7b3c);border:1px solid #e6c885;color:#1a1206;font-weight:700;padding:9px 20px;border-radius:9px;cursor:pointer;font-size:14px;}
.btn:active{transform:scale(.96);}
.btn[disabled]{background:#3a3125;color:#776a55;border-color:#3a3125;cursor:not-allowed;}
.btn.red{background:linear-gradient(180deg,#8a3030,#5c1f1f);color:#ffd9d9;border-color:#8a3030;}
.muted{color:var(--dim);font-size:12.5px;text-align:center;margin-top:8px;}
.subtabs{display:flex;gap:6px;max-width:560px;margin:0 auto 12px;overflow-x:auto;padding-bottom:2px;}
.subtab{flex-shrink:0;padding:7px 13px;font-size:12.5px;cursor:pointer;background:#0f0b07;border:1px solid var(--bd);border-radius:9px;color:var(--dim);}
.subtab.active{background:#3a2c14;color:var(--brz2);border-color:var(--brz);font-weight:600;}

/* Компактный магазин */
.shopwrap{display:flex;gap:6px;max-width:680px;margin:0 auto;align-items:flex-start;flex-wrap:wrap;flex-direction:row-reverse;}
.shopcats{display:flex;flex-direction:column;gap:4px;flex-shrink:0;min-width:36px;width:36px;}
.shopcats .subtab{padding:7px 0;text-align:center;font-size:14px;border-radius:8px;}
.goods{flex:1;min-width:220px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:560px;margin:0 auto;}
.itm{position:relative;background:#171208;border:2px solid var(--bd);border-radius:8px;padding:6px;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:6px;text-align:left;}
.itm .ic{font-size:18px;flex-shrink:0;}
.itm .mid{flex:1;min-width:0;}
.itm .nm{font-weight:600;font-size:11.5px;line-height:1.2;}
.itm .st{color:var(--dim);font-size:9.5px;line-height:1.2;}
.itm .pr{color:var(--brz2);font-weight:700;font-size:10.5px;white-space:nowrap;text-align:right;}
.itm .lk{color:#c9a35c;font-size:9px;margin-top:2px;}
.rgroup-title{font-size:11px;font-weight:700;margin:10px 2px 4px;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.rgroup-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg, #3a2f1e, transparent);}
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; gap: 4px; } .goods { min-width: 0; } }

/* Герой */
.heroLay{display:flex;gap:8px;max-width:680px;margin:0 auto;align-items:flex-start;}
.heroSide{display:flex;flex-direction:column;gap:5px;flex-shrink:0;width:46px;}
.heroSide .subtab{padding:9px 0;text-align:center;font-size:17px;}
.heroMain{flex:1;min-width:0;}
.paperdoll{position:relative;flex:1;height:360px;border:2px solid #5a4726;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,#241b10,#120d07);box-shadow:inset 0 0 24px rgba(0,0,0,.6),0 4px 14px rgba(0,0,0,.5);}
.paperdoll::before{content:'';position:absolute;inset:3px;border:1px solid rgba(201,163,92,.22);border-radius:10px;pointer-events:none;}
.sil{position:absolute;top:6%;left:50%;transform:translateX(-50%);font-size:100px;opacity:.18;filter:grayscale(1);pointer-events:none;}
.pslot{position:absolute;width:46px;height:46px;transform:translateX(-50%);border:2px solid #4a3a20;border-radius:10px;background:linear-gradient(135deg,rgba(201,163,92,.10),transparent 45%),#161007;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 0 8px rgba(0,0,0,.7);font-size:8px;color:var(--dim);}
.pslot .ic{font-size:16px;opacity:.5;}
.pslot .lbl{font-size:7.5px;line-height:1.1;}
.pslot.full{border-color:var(--rar,#c9a35c);box-shadow:inset 0 0 8px rgba(0,0,0,.7),0 0 10px rgba(201,163,92,.4);}
.pslot.full .ic{opacity:1;filter:drop-shadow(0 0 4px rgba(230,200,133,.8));}

/* Статы */
.stat-grid{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.stat-item{background:#171208;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:8px;flex:1;min-width:100px;justify-content:space-between;}
.stat-nm{font-size:11.5px;color:var(--dim);}
.stat-val{font-weight:700;color:var(--brz2);font-size:14px;}
.stat-btn{background:linear-gradient(180deg,#c9a35c,#9c7b3c);border:none;color:#1a1206;font-weight:bold;font-size:16px;width:24px;height:24px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.5);}
.stat-btn:active{transform:scale(0.9);}

/* Бой */
.bscene{display:flex;align-items:flex-start;justify-content:center;gap:10px;max-width:460px;margin:10px auto;}
.frame{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.pport{width:58px;height:58px;border-radius:50%;border:3px solid var(--brz);background:#241c13;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 14px rgba(201,163,92,.35);}
.frame.ev .pport{border-color:#8a4040;box-shadow:0 0 14px rgba(200,60,60,.3);}
.frame .nm{font-size:12px;color:var(--brz2);font-weight:600;}
.hpbar{width:100%;height:11px;background:#0d0a06;border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.hpbar>i{display:block;height:100%;transition:width .4s;}
.hpbar.h>i{background:linear-gradient(90deg,#3c8b4a,#6cc27a);}
.hpbar.e>i{background:linear-gradient(90deg,#8b3c3c,#c26a6a);}
.hpnum{font-size:11px;color:var(--dim);}
.vs{align-self:center;color:var(--brz);font-weight:800;font-size:18px;}
.log{max-width:460px;margin:10px auto;height:150px;overflow-y:auto;background:#120e09;border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:12.5px;line-height:1.55;}
.ln{margin:1px 0;}
.ln.h{color:#9fd08f;}.ln.e{color:#e09393;}.ln.s{color:var(--brz2);}.ln.c{color:#ffd34d;}
.ln.q{color:#c9b8a0;font-style:italic;}
.bbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;}

/* Тосты */
#toasts{position:fixed;top:calc(90px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:92vw;}
.toast{background:rgba(12,9,5,.95);color:var(--brz2);border:1px solid var(--bd);padding:7px 16px;border-radius:18px;font-size:13.5px;font-weight:600;animation:tin .2s,tout .3s 2.3s forwards;}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}

/* Оверлеи */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;}
#overlay.show{display:flex;}
#ovbox{background:linear-gradient(180deg,#241c10,#17110a);border:2px solid var(--bd);border-radius:16px;padding:18px;max-width:360px;width:100%;text-align:center;max-height:82vh;overflow-y:auto;}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#171208;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;font-size:13.5px;text-align:left;}
.opt.no{opacity:.45;cursor:not-allowed;}
.opt .c{color:var(--brz2);font-weight:700;white-space:nowrap;font-size:12.5px;text-align:right;}
.opt.dark{justify-content:center;color:var(--dim);}
.icard{border:2px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;background:#120e08;font-size:13px;}
.stchips{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap;}
.xpline{height:8px;background:#0d0a06;border:1px solid var(--bd);border-radius:4px;overflow:hidden;margin:6px 0 2px;}
.xpline>i{display:block;height:100%;background:linear-gradient(90deg,#4a7ab0,#7ab0e0);}
#err{position:fixed;bottom:0;left:0;right:0;background:#5c1414;color:#ffb0b0;font-size:12px;padding:8px 12px;display:none;z-index:99;white-space:pre-wrap;}
#err.show{display:block;}
.card,.icard,#ovbox,.scene{position:relative;border:2px solid #5a4726;border-radius:14px;box-shadow:0 0 0 1px #241a0c,0 6px 18px rgba(0,0,0,.65),inset 0 0 30px rgba(0,0,0,.55);background:linear-gradient(180deg,#2a2013 0%,#1c150c 60%,#150f08 100%);}
.card::before,.icard::before,.scene::before{content:'';position:absolute;inset:3px;border:1px solid rgba(201,163,92,.28);border-radius:10px;pointer-events:none;}
.divider{display:flex;align-items:center;gap:10px;max-width:460px;margin:14px auto 10px;color:var(--brz);}
.divider::before,.divider::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,transparent,#7a5c22,transparent);}
.divider span{font-size:13px;letter-spacing:2px;}

/* Сюжет */
#ovbox.story{background:linear-gradient(180deg,#1b150c,#100b06);padding:22px 20px;}
.story .who{text-align:center;color:var(--brz2);font-weight:700;font-size:15px;letter-spacing:1.5px;margin-bottom:4px;}
.story .who small{display:block;color:var(--dim);font-weight:400;font-size:11px;letter-spacing:0;}
.story .txt{font-style:italic;color:#e3d6bd;font-size:14.5px;line-height:1.7;text-align:left;margin:12px 0;}
.story .hr{height:2px;background:linear-gradient(90deg,transparent,#7a5c22,transparent);margin:10px 0;}

/* Экспедиция */
.exp-scene{position:relative;max-width:460px;margin:10px auto;height:200px;background:radial-gradient(ellipse at 50% 100%,#1c1610,#0b0805);border:2px solid #4a3a20;border-radius:16px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px;box-shadow:inset 0 0 40px rgba(0,0,0,.8);}
.exp-bg{position:absolute;inset:0;background-image:radial-gradient(#2a2013 1px, transparent 1px);background-size:20px 20px;opacity:.5;animation:bgScroll 10s linear infinite;}
@keyframes bgScroll{from{background-position:0 0;}to{background-position:20px 0;}}
.exp-hero{font-size:50px;position:relative;z-index:2;animation:walkBob 0.6s infinite alternate;}
@keyframes walkBob{from{transform:translateY(0) scaleX(-1);}to{transform:translateY(-5px) scaleX(-1);}}
.exp-enemy{position:absolute;right:30px;bottom:20px;font-size:40px;opacity:0;transition:opacity 0.5s, right 0.5s;z-index:1;}
.exp-enemy.active{opacity:1;right:100px;}
.exp-path-line{position:absolute;bottom:10px;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,#5a4726,transparent);}
.exp-stats{display:flex;justify-content:center;gap:10px;margin:10px 0;}
</style>
</head>
<body>

  <div class="stats">

function load(){

function cap(){var c=CONFIG.capBase;var id,b;for(id in S.buildings){b=S.buildings[id];if(b.t==='storage'&&!b.until)c+=CONFIG.capPerStorage*b.lvl;}if(S.eq.pack)c+=(ITEMS[S.eq.pack.id].pack||0);return c;}
function power(){var p=0;var id,b;for(id in S.buildings){b=S.buildings[id];if(b.t==='barracks'&&!b.until)p+=CONFIG.heroPowerPerBarracks*b.lvl;}return p;}
function oreRate(){var r=0;var id,b;for(id in S.buildings){b=S.buildings[id];if(b.t==='mine'&&!b.until)r+=2*b.lvl;}r*=S.oreMult;if(S.autoMine)r+=3*S.oreMult;for(id in S.buildings){b=S.buildings[id];if(b.t==='vent'&&!b.until)r*=1+0.10*b.lvl;}if(S.abil.minet)r*=1.1;return r;}

 if(R.tier==='farm'){return{R:R,key:k,ehp:R.ehp,eatk:R.eatk,deep:false,boss:false,farm:true};}
 return{R:R,key:k,ehp:R.ehp+(S.floor-1)*60,eatk:R.eatk+(S.floor-1)*5,deep:R.tier==='mid'||R.tier==='leg',boss:false,farm:false};

function grant(rw){if(rw.ore)S.ore=Math.min(cap(),S.ore+rw.ore);if(rw.star)S.star+=rw.star;if(rw.spd)S.spd+=rw.spd;if(rw.pot)S.pot+=rw.pot;}
function rollQuests(){var day=Math.floor(Date.now()/86400000);if(S.q&&S.q.day===day)return;S.q={day:day,qs:[]};var idx=[];var i;for(i=0;i<QPOOL.length;i++)idx.push(i);for(i=0;i<3&&idx.length;i++){var p=Math.floor(Math.random()*idx.length);S.q.qs.push({i:idx.splice(p,1)[0],p:0,done:false});}}
function qAdd(stat,n){rollQuests();var i;for(i=0;i<S.q.qs.length;i++){var q=S.q.qs[i];var def=QPOOL[q.i];if(q.done||def.stat!==stat)continue;q.p+=n;if(q.p>=def.goal){q.done=true;grant(def.rw);toast('✅ Задание дня: '+def.t+' — награда получена','success');}}}
function rwr(rw){var p=[];if(rw.ore)p.push(rw.ore+' руды');if(rw.star)p.push(rw.star+'⭐');if(rw.spd)p.push(rw.spd+'⚡');if(rw.pot)p.push(rw.pot+'🧪');return p.join(', ');}
function checkAch(){var i;for(i=0;i<ACHS.length;i++){var a=ACHS[i];if(!S.ach[a.id]){var ok=false;try{ok=a.c();}catch(e){}if(ok){S.ach[a.id]=1;toast('🏅 Достижение: '+a.n,'success');save();}}}}

 if(win){
  o=Math.round(R.rOre*floorBonus()*(S.abil.greed?1.15:1)*(BT.scrollUsed?2:1));st=Math.round(R.rStar*floorBonus());

  if(!d.farm){S.wins++;qAdd('wins',1);var nf=1+Math.floor(S.wins/5);if(nf>S.floor){S.floor=nf;toast('🏆 Спуск! Этаж '+nf,'success');}}
  qAdd('oreGot',o);

  else{var rar1=lootRoll(R.w);if(d.boss)rar1=Math.max(4,rar1);loot=giveLoot(lootItem(rar1));if((d.deep||d.boss)&&Math.random()<0.25)loot2=giveLoot(lootItem(lootRoll(R.w)));if(!d.deep&&!d.boss&&Math.random()<0.15)loot2=giveLoot(lootItem(lootRoll(R.w)));}
  if(S.guideStep===4)S.guideStep=5;
  if(d.boss){S.bosses[S.floor]=true;toast('💀 Босс повержен: '+R.en,'success');}
  var pageDrop=d.farm?0:(d.deep?0.2:(d.boss?1:0.08));
  if(Math.random()<pageDrop){var missing=[];var p;for(p=0;p<DIARY.length;p++)if(S.diary.indexOf(p)<0)missing.push(p);if(missing.length){var pick=missing[Math.floor(Math.random()*missing.length)];S.diary.push(pick);S.diary.sort(function(a,b){return a-b;});setTimeout(function(){toast('📜 Найдена страница дневника');},800);}}
 }else{var lost=Math.floor(S.ore*(d.deep?0.15:0.1));S.ore=Math.max(0,S.ore-lost);}
 if(win&&R.cd>0){S.raidCd[BT.k]=Date.now()+R.cd*60000*(S.abil.swift?CONFIG.raidCdSwiftMult:1);}
 tgHaptic(win?'success':'error');
 var ov=$('ovbox');var h='';
 h+='<h3 style="margin:0;color:'+(win?'var(--grn)':'var(--dgr)')+';">'+(win?'ПОБЕДА!':'ПОРАЖЕНИЕ')+'</h3>';

 h+='<div class="stchips" style="margin-top:10px;"><span class="chip">Раундов: '+BT.round+'</span><span class="chip">⚔ Нанесено: '+BT.dDealt+'</span><span class="chip">🩸 Получено: '+BT.dTaken+'</span><span class="chip">Опыт: +'+xp+'</span>';
 if(win)h+='<span class="chip">⛏ +'+o+'</span><span class="chip">⭐ +'+st+'</span>';else h+='<span class="chip">Лечение: −руды</span>';
 h+='</div>';
 if(win){if(loot)h+=lootCard(loot);else if(!d.farm)h+='<div class="muted">Лут не выпал.</div>';if(loot2)h+=lootCard(loot2);}
 else{h+='<div class="muted">Совет: качайте армию, экипировку и статы.</div>';}
 if(win){
  if(BT.isExp){ EXP.ore += o; EXP.xp += xp; EXP.enemy = null; h+='<button class="btn" data-act="exp_after_battle" style="margin-top:8px;">Дальше вглубь</button>'; }
  else{ h+='<button class="btn" data-act="close" style="margin-top:8px;">Продолжить</button>'; }
 }else{
  if(BT.isExp){ EXP = {depth:0, ore:0, xp:0, step:0, inProgress:false, enemy:null}; toast('Вы отступили. Поход провален.','error'); h+='<button class="btn red" data-act="exp_after_battle" style="margin-top:8px;">Вернуться</button>'; }
  else{ h+='<button class="btn" data-act="close" style="margin-top:8px;">Продолжить</button>'; }
 }
 ov.innerHTML=h;ov.classList.remove('story');showOverlay();
