<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тихая Гавань</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #1B2A41 0%, #2a3a55 100%);
    color: #E8D5B7;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body { display: flex; justify-content: center; }
  #app { width: 100%; max-width: 480px; min-height: 100vh; padding: 12px; }

  /* ==== BASE VIEW ==== */
  .base-view { display: flex; flex-direction: column; gap: 14px; }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px;
    background: rgba(201, 162, 39, 0.1);
    border: 1px solid rgba(201, 162, 39, 0.3);
    border-radius: 12px;
  }
  .resources { display: flex; align-items: baseline; gap: 8px; font-size: 22px; font-weight: 600; width: 100%; }
  .res-icon { font-size: 20px; }
  #res-count { color: #C9A227; min-width: 40px; display: inline-block; }
  .res-rate { font-size: 12px; opacity: 0.7; margin-left: auto; }

  .tap-zone { display: flex; justify-content: center; padding: 8px 0; }
  .tap-btn {
    width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #C9A227, #8B6f14);
    border: 3px solid #E8D5B7;
    color: #1B2A41;
    font-family: inherit; font-weight: 700;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3), 0 0 30px rgba(201, 162, 39, 0.3);
    transition: transform 0.08s ease;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .tap-btn:active { transform: scale(0.94) translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
  .tap-emoji { font-size: 32px; }
  .tap-label { font-size: 13px; text-align: center; padding: 0 8px; line-height: 1.2; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 0 30px rgba(201, 162, 39, 0.3); }
    50% { box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 0 50px rgba(201, 162, 39, 0.6); }
  }

  .section-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    color: #C9A227; opacity: 0.85; padding-left: 4px; margin-top: 4px;
  }

  .upgrades, .npcs { display: flex; flex-direction: column; gap: 8px; }
  .upgrade-card {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 10px;
    background: rgba(232, 213, 183, 0.05);
    border: 1px solid rgba(232, 213, 183, 0.15);
    transition: all 0.2s;
  }
  .upgrade-card.affordable { border-color: rgba(201, 162, 39, 0.5); background: rgba(201, 162, 39, 0.08); }
  .upgrade-card.maxed { opacity: 0.6; }
  .upg-icon { font-size: 24px; }
  .upg-info { flex: 1; min-width: 0; }
  .upg-name { font-size: 14px; font-weight: 600; }
  .upg-lvl { font-size: 11px; color: #C9A227; font-weight: 400; }
  .upg-cost { font-size: 12px; opacity: 0.75; margin-top: 2px; }
  .upg-hint { font-size: 11px; color: #C9A227; margin-top: 3px; font-weight: 500; }
  .upg-btn {
    width: 40px; height: 40px; border-radius: 8px;
    background: #C9A227; color: #1B2A41;
    border: none; font-size: 22px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    flex-shrink: 0;
  }
  .upg-btn:disabled { background: #555; opacity: 0.5; cursor: not-allowed; }
  .upg-btn:not(:disabled):active { transform: scale(0.9); }

  .npc-card {
    display: flex; gap: 12px; align-items: center;
    padding: 12px; border-radius: 10px;
    background: rgba(232, 213, 183, 0.05);
    border: 1px solid rgba(232, 213, 183, 0.15);
  }
  .npc-avatar-sm {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; border: 2px solid;
    background: rgba(232, 213, 183, 0.1); flex-shrink: 0;
  }
  .npc-info { flex: 1; min-width: 0; }
  .npc-name-sm { font-size: 14px; font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .npc-progress { font-size: 11px; color: #C9A227; font-weight: 400; }
  .locked { font-size: 11px; opacity: 0.5; font-weight: 400; margin-left: 6px; }
  .trust-bar {
    height: 8px; background: rgba(0,0,0,0.3); border-radius: 4px;
    overflow: hidden; margin-bottom: 4px;
  }
  .trust-fill { height: 100%; transition: width 0.4s ease; border-radius: 4px; }
  .trust-val { font-size: 11px; opacity: 0.7; }
  .trust-hint { font-size: 10px; opacity: 0.5; margin-top: 2px; }

  .final-banner {
    padding: 16px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(201, 162, 39, 0.2), rgba(139, 69, 19, 0.2));
    border: 2px solid #C9A227;
    text-align: center; font-size: 14px;
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 15px rgba(201,162,39,0.3); }
    50% { box-shadow: 0 0 30px rgba(201,162,39,0.6); }
  }
  .final-btn {
    margin-top: 10px; padding: 10px 20px;
    background: #C9A227; color: #1B2A41;
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .final-btn:active { transform: scale(0.96); }

  /* ==== SCENE VIEW ==== */
  .scene-view {
    display: flex; flex-direction: column; min-height: calc(100vh - 24px);
    gap: 16px;
  }
  .portrait {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 24px 0;
  }
  .npc-avatar {
    width: 120px; height: 120px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 60px; border: 3px solid;
    background: rgba(232, 213, 183, 0.08);
    animation: floatIn 0.5s ease;
  }
  .npc-avatar.empty { font-size: 50px; border-color: rgba(232, 213, 183, 0.2); }
  @keyframes floatIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .npc-name { font-size: 18px; font-weight: 700; color: #C9A227; }

  .dialog-box {
    background: rgba(232, 213, 183, 0.08);
    border: 1px solid rgba(232, 213, 183, 0.2);
    border-radius: 16px;
    padding: 20px;
    flex: 1;
    display: flex; flex-direction: column; gap: 16px;
  }
  .dialog-text {
    font-size: 15px; line-height: 1.6;
    min-height: 80px;
  }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice-btn {
    padding: 12px 16px;
    background: rgba(201, 162, 39, 0.15);
    border: 1px solid rgba(201, 162, 39, 0.4);
    color: #E8D5B7;
    border-radius: 10px;
    font-size: 14px; text-align: left; cursor: pointer;
    font-family: inherit; line-height: 1.4;
    transition: all 0.15s;
  }
  .choice-btn:active { transform: scale(0.98); background: rgba(201, 162, 39, 0.3); }
  .choice-btn:hover { background: rgba(201, 162, 39, 0.25); }

  /* ==== ENDING VIEW ==== */
  .ending-view {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: calc(100vh - 24px);
    gap: 24px; text-align: center; padding: 20px;
  }
  .ending-title {
    font-size: 28px; font-weight: 700; color: #C9A227;
    animation: floatIn 0.8s ease;
  }
  .ending-text {
    font-size: 15px; line-height: 1.7; opacity: 0.9;
    max-width: 360px;
    animation: floatIn 1s ease;
  }
  .restart-btn {
    margin-top: 20px; padding: 14px 28px;
    background: #C9A227; color: #1B2A41;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .restart-btn:active { transform: scale(0.96); }

  /* ==== SCENE PROGRESS ==== */
  .scene-progress {
    text-align: center; font-size: 12px; opacity: 0.7;
    padding: 6px 0;
  }
  .scene-progress b { color: #C9A227; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

const SAVE_KEY = 'quiet_harbor_v2';
const TAP_GAIN = 5;
const INCOME_PER_LEVEL = 0.3;
const OFFLINE_CAP_SEC = 8 * 3600;
const OFFLINE_RATE = 0.6;
const START_RESOURCES = 20;

let state = null;
let tickInterval = null;

const UPGRADES = {
  bed:       { name: "Кровати",   icon: "🛏️", costs: [15, 40, 90, 200], npc: "mila" },
  kitchen:   { name: "Кухня",     icon: "🍲", costs: [20, 50, 120, 250], npc: "grisha" },
  med:       { name: "Медпункт",  icon: "💊", costs: [25, 60, 140, 300], npc: "anya" },
  generator: { name: "Генератор", icon: "⚡", costs: [30, 80, 180, 400], npc: null }
};

const NPCS = {
  mila:   { name: "Мила",   emoji: "🧣", color: "#C9A227" },
  grisha: { name: "Гриша",  emoji: "⌚", color: "#8B4513" },
  anya:   { name: "Аня",    emoji: "🔪", color: "#4A6741" }
};

const SCENES = {
  intro: {
    npc: null,
    text: "Год 2040-й. Семь лет назад Катастрофа разорвала мир.\n\nТы — смотритель убежища. Где-то в долине ещё есть выжившие.\n\nСегодня на пороге появилась первая...",
    choices: [{ text: "Начать", next: "base" }]
  },

  // ==== MILA ====
  mila_1: {
    npc: "mila",
    text: "Мила стоит на пороге, кутаясь в старый шарф. В глазах — усталость и надежда.\n\n— Я слышала, здесь можно найти приют. У меня больше никого не осталось.",
    choices: [
      { text: "«Оставайся. Здесь тепло»", trust: { mila: 15 }, next: "mila_1_good" },
      { text: "«Что ты умеешь?»", trust: { mila: 5 }, next: "mila_1_neutral" },
      { text: "«Проходи, но помни: я решаю»", trust: { mila: -10 }, next: "mila_1_hard" }
    ]
  },
  mila_1_good: {
    npc: "mila",
    text: "Мила благодарно кивает, и в её глазах загорается что-то похожее на тепло.\n\n— Спасибо. Я буду помогать — на кухне, с детьми, везде.",
    choices: [{ text: "Продолжить", next: "base" }]
  },
  mila_1_neutral: {
    npc: "mila",
    text: "— Я умею готовить. И швы накладывать — учил муж. И слушать умею.\n\nОна смотрит прямо, без вызова.\n\n— Больше ничего не обещаю.",
    choices: [{ text: "Продолжить", next: "base" }]
  },
  mila_1_hard: {
    npc: "mila",
    text: "— Я помню, кто здесь главный. Только не забудь, что и я не забуду.\n\nОна входит, не глядя на тебя.",
    choices: [{ text: "Продолжить", next: "base" }]
  },
  mila_2: {
    npc: "mila",
    text: "Мила сидит у окна с шитьём. За окном — снег.\n\n— Знаешь, я ведь не просто так пришла. Мой сын... он был там, за тоннелем. Я ищу его.",
    choices: [
      { text: "«Мы найдём его. Вместе»", trust: { mila: 15 }, next: "base" },
      { text: "«За тоннель я не пойду. Слишком опасно»", trust: { mila: -15 }, next: "base" },
      { text: "«Расскажи мне о нём»", trust: { mila: 10 }, next: "base" }
    ]
  },

  // ==== GRISHA ====
  grisha_1: {
    npc: "grisha",
    text: "Гриша — бывший инженер, потерявший всё. Он пришёл сам, с пустыми руками, но с часами на запястье.\n\n— Слышал, у вас генератор барахлит. Я могу помочь. Только...\n\nОн замолкает.",
    choices: [
      { text: "«Только что?»", trust: { grisha: 5 }, next: "grisha_1b" },
      { text: "«Проходи, не стой на пороге»", trust: { grisha: 15 }, next: "grisha_1_good" },
      { text: "«С чего мне тебе верить?»", trust: { grisha: -10 }, next: "grisha_1_hard" }
    ]
  },
  grisha_1b: {
    npc: "grisha",
    text: "— Только не спрашивай, что я делал до этого. Я не горжусь.\n\nОн смотрит в пол, и в его глазах — что-то тяжёлое.",
    choices: [
      { text: "«Каждый заслуживает второго шанса»", trust: { grisha: 10 }, next: "base" },
      { text: "«Расскажешь — останешься»", trust: { grisha: -5 }, next: "base" }
    ]
  },
  grisha_1_good: {
    npc: "grisha",
    text: "Гриша входит, и что-то в его плечах расслабляется.\n\n— Спасибо. Я починю генератор к утру. Считай, это мой вклад.",
    choices: [{ text: "Продолжить", next: "base" }]
  },
  grisha_1_hard: {
    npc: "grisha",
    text: "— Правильно. Верить незнакомцам — глупо. Но и не верить совсем — тоже.\n\nОн входит, но держится в стороне.",
    choices: [{ text: "Продолжить", next: "base" }]
  },
  grisha_2: {
    npc: "grisha",
    text: "Гриша сидит у генератора, крутит гайку.\n\n— Смотритель. Тогда, семь лет назад... я был там, где всё началось. И я мог остановить. Не остановил.",
    choices: [
      { text: "«Это прошлое. Ты здесь и сейчас»", trust: { grisha: 20 }, next: "base" },
      { text: "«Значит, ты виноват»", trust: { grisha: -20 }, next: "base" },
      { text: "«Расскажи, что ты видел»", trust: { grisha: 10 }, next: "base" }
    ]
  },

  // ==== ANYA ====
  anya_1: {
    npc: "anya",
    text: "Аня пришла ночью, с ножом за поясом и без единого слова. Она молча стоит у входа.\n\n— ...\n\nОна не говорит.",
    choices: [
      { text: "«Ты можешь остаться»", trust: { anya: 15 }, next: "anya_1_good" },
      { text: "«Сначала отдай нож»", trust: { anya: -15 }, next: "anya_1_hard" },
      { text: "Молча кивнуть в сторону свободной койки", trust: { anya: 10 }, next: "anya_1_neutral" }
    ]
  },
  anya_1_good: {
    npc: "anya",
    text: "Она смотрит долго. Потом кивает — один раз.\n\n— Аня.\n\nВсё. Больше она ничего не скажет сегодня.",
    choices: [{ text: "Продолжить", next: "base" }]
  },
  anya_1_hard: {
    npc: "anya",
    text: "Она сжимает рукоять, но потом медленно вынимает нож и кладёт его на стол.\n\n— Пока. Заберу, когда пойму, что здесь безопасно.",
    choices: [{ text: "Продолжить", next: "base" }]
  },
  anya_1_neutral: {
    npc: "anya",
    text: "Она проходит мимо тебя и садится на койку. Через минуту уже спит — или делает вид.",
    choices: [{ text: "Продолжить", next: "base" }]
  },
  anya_2: {
    npc: "anya",
    text: "Аня стоит у окна. За её спиной — нож, теперь уже привычно.\n\n— Ты знаешь, почему я пришла? Потому что слышала: здесь не спрашивают. Просто... дают место.",
    choices: [
      { text: "«Правда. Ты здесь своя»", trust: { anya: 20 }, next: "base" },
      { text: "«Место нужно заслужить»", trust: { anya: -15 }, next: "base" },
      { text: "«Ты уже заслужила»", trust: { anya: 15 }, next: "base" }
    ]
  },

  // ==== FINAL ====
  final: {
    npc: null,
    text: "Прошло несколько недель. Убежище живёт. Но приближается зима, и нужно решить, как жить дальше.\n\nТы собираешь всех на совет. Впереди — твой выбор.",
    choices: [
      { text: "«Мы одна семья. Все равны»", ending: "savior" },
      { text: "«Я уйду за тоннель. Один»", ending: "loner" },
      { text: "«Порядок важнее. Я решаю — вы подчиняетесь»", ending: "tyrant" }
    ]
  },

  // ==== ENDINGS ====
  ending_savior: {
    npc: null, ending: true,
    title: "🌅 Спаситель",
    text: "Ты выбрал общину. Все остались. Мила нашла сына весной — Гриша и Аня пошли с ней за тоннель.\n\nУбежище стало домом. Не идеальным — но живым.\n\nТы не спас мир. Ты спас этих троих. Этого достаточно."
  },
  ending_loner: {
    npc: null, ending: true,
    title: "🚶 Одиночка",
    text: "Ты ушёл за тоннель один. Никто не остановил — каждый сделал свой выбор.\n\nГоворят, ты нашёл другой лагерь. Говорят, ты вернулся. Говорят, ты погиб.\n\nПравду знаешь только ты. И её ты унёс с собой."
  },
  ending_tyrant: {
    npc: null, ending: true,
    title: "👑 Тиран",
    text: "Ты установил порядок. Жёсткий, но работающий. Никто не голодает — потому что никто не спорит.\n\nМила больше не поёт. Гриша молчит. Аня смотрит волком.\n\nУбежище выжило. Но что-то важное в нём умерло."
  }
};

function defaultState() {
  return {
    view: "intro",
    scene: "intro",
    resources: START_RESOURCES,
    totalResources: 0,
    upgrades: { bed: 0, kitchen: 0, med: 0, generator: 0 },
    npcs: {
      mila:   { recruited: false, trust: 50, scenesPlayed: 0 },
      grisha: { recruited: false, trust: 50, scenesPlayed: 0 },
      anya:   { recruited: false, trust: 50, scenesPlayed: 0 }
    },
    lastTick: Date.now(),
    finalAvailable: false
  };
}

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}

function load() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (s) return JSON.parse(s);
  } catch (e) {}
  return null;
}

function getTotalRate() {
  let r = 0;
  for (const k in state.upgrades) r += state.upgrades[k] * INCOME_PER_LEVEL;
  return r;
}

function totalScenes() {
  return state.npcs.mila.scenesPlayed + state.npcs.grisha.scenesPlayed + state.npcs.anya.scenesPlayed;
}

function checkFinalAvailable() {
  const all = state.npcs.mila.scenesPlayed >= 2
           && state.npcs.grisha.scenesPlayed >= 2
           && state.npcs.anya.scenesPlayed >= 2;
  state.finalAvailable = all;
}

function init() {
  const saved = load();
  state = saved || defaultState();

  if (saved) {
    const dt = Math.min((Date.now() - (state.lastTick || Date.now())) / 1000, OFFLINE_CAP_SEC);
    const rate = getTotalRate();
    if (rate > 0 && dt > 60) {
      state.resources += Math.floor(rate * dt * OFFLINE_RATE);
    }
  }

  state.lastTick = Date.now();
  render();
  startTick();
}

function startTick() {
  if (tickInterval) clearInterval(tickInterval);
  tickInterval = setInterval(() => {
    const now = Date.now();
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;
    const gain = getTotalRate() * dt;
    if (gain > 0 && state.view === "base") {
      state.resources += gain;
      const el = document.getElementById("res-count");
      if (el) el.textContent = Math.floor(state.resources);
    } else {
      state.resources += gain;
    }
    save();
  }, 1000);
}

function render() {
  if (state.view === "intro" || state.view === "scene") renderScene();
  else if (state.view === "base") renderBase();
  else if (state.view === "ending") renderEnding();
}

function renderScene() {
  const s = SCENES[state.scene];
  if (!s) { state.view = "base"; return render(); }

  const npc = s.npc ? NPCS[s.npc] : null;
  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="scene-view">
      <div class="portrait">
        ${npc
          ? `<div class="npc-avatar" style="border-color: ${npc.color}; color: ${npc.color}">${npc.emoji}</div>
             <div class="npc-name">${npc.name}</div>`
          : `<div class="npc-avatar empty">🌊</div>`}
      </div>
      <div class="dialog-box">
        <div class="dialog-text">${s.text.replace(/\n/g, '<br>')}</div>
        <div class="choices">
          ${s.choices.map((c, i) => `<button class="choice-btn" data-choice="${i}">${c.text}</button>`).join('')}
        </div>
      </div>
    </div>`;

  app.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => handleChoice(parseInt(btn.dataset.choice, 10)));
  });
}

function handleChoice(idx) {
  const s = SCENES[state.scene];
  const choice = s.choices[idx];
  if (!choice) return;

  if (choice.trust) {
    for (const npc in choice.trust) {
      state.npcs[npc].trust = Math.max(0, Math.min(100, state.npcs[npc].trust + choice.trust[npc]));
    }
  }

  if (choice.ending) {
    state.view = "ending";
    state.scene = "ending_" + choice.ending;
    save();
    render();
    return;
  }

  if (choice.next === "base") {
    if (s.npc) {
      state.npcs[s.npc].scenesPlayed++;
      state.npcs[s.npc].recruited = true;
    }
    state.view = "base";
    checkFinalAvailable();
    save();
    render();
  } else if (choice.next === "intro") {
    state.view = "intro";
    state.scene = "intro";
    save();
    render();
  } else if (choice.next) {
    state.scene = choice.next;
    save();
    render();
  }
}

function renderBase() {
  const app = document.getElementById("app");
  const rate = getTotalRate();
  const scenes = totalScenes();
  const total = 6;

  app.innerHTML = `
    <div class="base-view">
      <header class="header">
        <div class="resources">
          <span class="res-icon">🌾</span>
          <span id="res-count">${Math.floor(state.resources)}</span>
          <span class="res-rate">+${rate.toFixed(2)}/сек</span>
        </div>
      </header>

      <div class="tap-zone">
        <button class="tap-btn" id="tap-btn">
          <div class="tap-emoji">🔨</div>
          <div class="tap-label">Собрать ресурсы</div>
        </button>
      </div>

      <div class="section-title">Улучшения</div>
      <div class="upgrades">
        ${Object.entries(UPGRADES).map(([k, u]) => {
          const lvl = state.upgrades[k];
          const cost = u.costs[lvl];
          const canAfford = cost !== undefined && state.resources >= cost;
          const maxed = lvl >= u.costs.length;
          const opensScene = u.npc && lvl < 2 && !maxed;
          return `
            <div class="upgrade-card ${canAfford ? 'affordable' : ''} ${maxed ? 'maxed' : ''}">
              <div class="upg-icon">${u.icon}</div>
              <div class="upg-info">
                <div class="upg-name">${u.name} <span class="upg-lvl">ур. ${lvl}</span></div>
                <div class="upg-cost">${maxed ? 'Максимум' : `Стоимость: ${cost} 🌾`}</div>
                ${opensScene ? `<div class="upg-hint">→ откроет сцену с ${NPCS[u.npc].name}</div>` : ''}
              </div>
              ${maxed ? '' : `<button class="upg-btn" data-upg="${k}" ${canAfford ? '' : 'disabled'}>+</button>`}
            </div>`;
        }).join('')}
      </div>

      <div class="section-title">Выжившие</div>
      <div class="npcs">
        ${Object.entries(NPCS).map(([k, n]) => {
          const npc = state.npcs[k];
          return `
            <div class="npc-card">
              <div class="npc-avatar-sm" style="border-color: ${n.color}">${n.emoji}</div>
              <div class="npc-info">
                <div class="npc-name-sm">
                  <span>${n.name}${npc.recruited ? '' : ' <span class="locked">(ждёт в долине)</span>'}</span>
                  <span class="npc-progress">${npc.scenesPlayed}/2</span>
                </div>
                <div class="trust-bar">
                  <div class="trust-fill" style="width: ${npc.trust}%; background: ${n.color}"></div>
                </div>
                <div class="trust-val">Доверие: ${npc.trust} · влияет на финал</div>
              </div>
            </div>`;
        }).join('')}
      </div>

      <div class="scene-progress">Сцены: <b>${scenes}</b> / ${total}</div>

      ${state.finalAvailable ? `
        <div class="final-banner">
          <div>Приближается зима. Пора решать.</div>
          <button class="final-btn" id="final-btn">Собрать совет →</button>
        </div>` : ''}
    </div>`;

  document.getElementById("tap-btn").addEventListener("click", () => {
    state.resources += TAP_GAIN;
    state.totalResources += TAP_GAIN;
    const el = document.getElementById("res-count");
    if (el) el.textContent = Math.floor(state.resources);
    save();
  });

  app.querySelectorAll('.upg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.upg;
      const u = UPGRADES[k];
      const lvl = state.upgrades[k];
      const cost = u.costs[lvl];
      if (cost === undefined || state.resources < cost) return;

      state.resources -= cost;
      state.upgrades[k] = lvl + 1;
      const newLevel = state.upgrades[k];

      if (u.npc && state.npcs[u.npc]) {
        const npc = state.npcs[u.npc];
        let sceneToPlay = null;
        if (newLevel >= 1 && npc.scenesPlayed === 0) sceneToPlay = 1;
        else if (newLevel >= 2 && npc.scenesPlayed === 1) sceneToPlay = 2;

        if (sceneToPlay) {
          state.view = "scene";
          state.scene = u.npc + "_" + sceneToPlay;
          save();
          render();
          return;
        }
      }

      save();
      render();
    });
  });

  const finalBtn = document.getElementById("final-btn");
  if (finalBtn) {
    finalBtn.addEventListener('click', () => {
      state.view = "scene";
      state.scene = "final";
      save();
      render();
    });
  }
}

function renderEnding() {
  const s = SCENES[state.scene];
  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="ending-view">
      <div class="ending-title">${s.title}</div>
      <div class="ending-text">${s.text.replace(/\n/g, '<br>')}</div>
      <button class="restart-btn" id="restart-btn">Начать заново</button>
    </div>`;

  document.getElementById("restart-btn").addEventListener('click', () => {
    if (confirm("Начать новую историю? Прогресс будет потерян.")) {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      state = defaultState();
      state.view = "intro";
      state.scene = "intro";
      save();
      render();
    }
  });
}

init();
</script>
</body>
</html>
