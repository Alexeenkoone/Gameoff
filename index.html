<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магнат глубин v9</title>
<style>
:root{--bg:#0e0b08;--panel:#1c1610;--panel2:#261d12;--brz:#c9a35c;--brz2:#e6c885;--tx:#e8ddc8;--dim:#8f8270;--bd:#3a2f1e;--dgr:#ff5252;--grn:#7ed957;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;height:100vh;overflow:hidden;background:linear-gradient(180deg,#17110a,#0b0805);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;display:flex;flex-direction:column;}
header{position:sticky;top:0;z-index:40;flex-shrink:0;background:linear-gradient(180deg,#241c12,#1a140c);border-bottom:2px solid var(--bd);padding:5px 8px 7px;display:flex;flex-direction:column;gap:5px;}
.stats{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.stats .chip{font-size:11px;padding:2px 6px;}
.chip{background:#0f0b07;border:1px solid var(--bd);border-radius:12px;padding:3px 7px;font-size:12px;white-space:nowrap;}
.chip b{color:var(--brz2);}
nav{display:flex;gap:5px;width:100%;}
.tab{flex:1;padding:8px 3px;text-align:center;font-size:12px;cursor:pointer;background:#0f0b07;border:1px solid var(--bd);border-radius:9px;color:var(--dim);}
.tab.active{background:linear-gradient(180deg,#c9a35c,#9c7b3c);color:#1a1206;font-weight:700;border-color:var(--brz);}
main{flex:1;overflow-y:auto;padding:10px 10px 30px;}
.view{display:none;}
.view.active{display:block;}
#guide{display:none;margin:0 auto 10px;max-width:560px;padding:8px 12px;border-radius:20px;background:rgba(201,163,92,.12);border:1px solid rgba(201,163,92,.55);color:var(--brz2);font-size:12.5px;text-align:center;}
#guide.show{display:block;}
#guide .gbtn{display:inline-block;margin-left:8px;padding:3px 12px;border-radius:12px;background:#c9a35c;color:#1a1206;font-weight:700;cursor:pointer;font-size:12px;}
h2{color:var(--brz2);text-align:center;margin:4px 0 10px;font-size:19px;text-shadow:0 0 12px rgba(201,163,92,.4);}
.scene{max-width:560px;margin:0 auto;border:2px solid #4a3a20;border-radius:16px;background:radial-gradient(ellipse at 50% 0%,#221a10 0%,#120d07 70%);padding:10px 12px 12px;box-shadow:0 0 24px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.5);}
.scene-title{text-align:center;color:var(--brz2);font-weight:700;margin-bottom:8px;font-size:14px;letter-spacing:.5px;}
.scene-info{text-align:center;color:var(--dim);font-size:12px;margin-top:8px;}
#city{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.cell{position:relative;aspect-ratio:1;background:#171208;border:2px dashed #3d2f18;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cell.filled{border-style:solid;border-color:#4d3c1e;background:#1d1509;}
.cell .plus{color:#4d3f26;font-size:20px;font-weight:700;}
.bld{position:absolute;inset:3px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;text-align:center;padding:2px;}
.bld .ico{font-size:20px;}
.bld .lvl{position:absolute;top:2px;right:4px;font-size:9px;background:#000;border:1px solid var(--bd);border-radius:5px;padding:0 4px;color:var(--brz2);}
.bld .pbar{position:absolute;bottom:4px;left:4px;right:4px;height:4px;background:#000;border-radius:2px;overflow:hidden;}
.bld .pbar>i{display:block;height:100%;background:var(--brz);}
.bld.mine{background:linear-gradient(180deg,#243018,#171a0d);border:1px solid #4d5c2a;}
.bld.storage{background:linear-gradient(180deg,#332a12,#1d1708);border:1px solid #6a5628;}
.bld.barracks{background:linear-gradient(180deg,#331c12,#1d0f08);border:1px solid #6a3c28;}
.bld.forge{background:linear-gradient(180deg,#3a1c0e,#200d05);border:1px solid #7a4020;}
.bld.vent{background:linear-gradient(180deg,#1a2430,#0d1218);border:1px solid #3c5468;}
.bld.altar{background:linear-gradient(180deg,#2c1a33,#170d1d);border:1px solid #5c3c68;}
.spark{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff;z-index:5;cursor:pointer;animation:pu 1.1s infinite alternate;}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.35)}}
.card{background:linear-gradient(180deg,#221a10,#181209);border:1px solid var(--bd);border-radius:14px;padding:12px;max-width:460px;margin:0 auto 12px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.5);}
.card h3{margin:0 0 5px;color:var(--brz2);}
.card .sub{color:var(--dim);font-size:12.5px;margin-bottom:6px;}
.bar2{height:9px;background:#0d0a06;border:1px solid var(--bd);border-radius:5px;overflow:hidden;margin:7px 0;}
.bar2>i{display:block;height:100%;background:linear-gradient(90deg,#9c7b3c,#e6c885);transition:width .3s;}
.btn{background:linear-gradient(180deg,#c9a35c,#9c7b3c);border:1px solid #e6c885;color:#1a1206;font-weight:700;padding:9px 20px;border-radius:9px;cursor:pointer;font-size:14px;}
.btn:active{transform:scale(.96);}
.btn[disabled]{background:#3a3125;color:#776a55;border-color:#3a3125;cursor:not-allowed;}
.btn.red{background:linear-gradient(180deg,#8a3030,#5c1f1f);color:#ffd9d9;border-color:#8a3030;}
.muted{color:var(--dim);font-size:12.5px;text-align:center;margin-top:8px;}
.subtabs{display:flex;gap:6px;max-width:560px;margin:0 auto 12px;overflow-x:auto;padding-bottom:2px;}
.subtab{flex-shrink:0;padding:7px 13px;font-size:12.5px;cursor:pointer;background:#0f0b07;border:1px solid var(--bd);border-radius:9px;color:var(--dim);}
.subtab.active{background:#3a2c14;color:var(--brz2);border-color:var(--brz);font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:560px;margin:0 auto;}
.itm{position:relative;background:#171208;border:2px solid var(--bd);border-radius:10px;padding:8px 9px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px;text-align:left;}
.itm .ic{font-size:22px;flex-shrink:0;}
.itm .mid{flex:1;min-width:0;}
.itm .nm{font-weight:600;font-size:12.5px;}
.itm .st{color:var(--dim);font-size:11px;}
.itm .pr{color:var(--brz2);font-weight:700;font-size:12px;white-space:nowrap;text-align:right;}
.itm .lk{color:#c9a35c;font-size:10.5px;margin-top:2px;}
.itm.locked .nm,.itm.locked .ic{opacity:.55;}
.ghead{color:var(--brz2);font-size:13px;font-weight:700;margin:14px 2px 6px;max-width:560px;}
.dollwrap{display:flex;gap:12px;max-width:560px;margin:0 auto;align-items:flex-start;flex-wrap:wrap;}
.paperdoll{position:relative;flex:1;min-width:240px;height:440px;border:2px solid #5a4726;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,#241b10,#120d07);box-shadow:inset 0 0 24px rgba(0,0,0,.6),0 4px 14px rgba(0,0,0,.5);}
.paperdoll::before{content:'';position:absolute;inset:3px;border:1px solid rgba(201,163,92,.22);border-radius:10px;pointer-events:none;}
.sil{position:absolute;top:6%;left:50%;transform:translateX(-50%);font-size:130px;opacity:.18;filter:grayscale(1);pointer-events:none;}
.pslot{position:absolute;width:54px;height:54px;transform:translateX(-50%);border:2px solid #4a3a20;border-radius:10px;background:linear-gradient(135deg,rgba(201,163,92,.10),transparent 45%),#161007;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 0 8px rgba(0,0,0,.7);font-size:8px;color:var(--dim);}
.pslot .ic{font-size:19px;opacity:.5;}
.pslot .lbl{font-size:7.5px;line-height:1.1;}
.pslot.full{border-color:var(--rar,#c9a35c);box-shadow:inset 0 0 8px rgba(0,0,0,.7),0 0 10px rgba(201,163,92,.4);}
.pslot.full .ic{opacity:1;filter:drop-shadow(0 0 4px rgba(230,200,133,.8));}
.bagcol{flex:1;min-width:240px;}
.bagmini{grid-template-columns:repeat(4,1fr);max-width:none;}
.bagbar{max-width:460px;margin:12px auto 6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.fchip{padding:5px 11px;font-size:12px;border:1px solid var(--bd);border-radius:14px;background:#0f0b07;color:var(--dim);cursor:pointer;}
.fchip.active{color:var(--brz2);border-color:var(--brz);}
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:460px;margin:0 auto;}
.bcell{position:relative;aspect-ratio:1;background:#151009;border:2px solid var(--bd);border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;color:var(--dim);text-align:center;padding:2px;}
.bcell.empty{opacity:.3;cursor:default;}
.bcell .ic{font-size:20px;}
.bscene{display:flex;align-items:flex-start;justify-content:center;gap:10px;max-width:460px;margin:10px auto;}
.frame{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.pport{width:58px;height:58px;border-radius:50%;border:3px solid var(--brz);background:#241c13;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 14px rgba(201,163,92,.35);}
.frame.ev .pport{border-color:#8a4040;box-shadow:0 0 14px rgba(200,60,60,.3);}
.frame .nm{font-size:12px;color:var(--brz2);font-weight:600;}
.hpbar{width:100%;height:11px;background:#0d0a06;border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.hpbar>i{display:block;height:100%;transition:width .4s;}
.hpbar.h>i{background:linear-gradient(90deg,#3c8b4a,#6cc27a);}
.hpbar.e>i{background:linear-gradient(90deg,#8b3c3c,#c26a6a);}
.hpnum{font-size:11px;color:var(--dim);}
.vs{align-self:center;color:var(--brz);font-weight:800;font-size:18px;}
.log{max-width:460px;margin:10px auto;height:150px;overflow-y:auto;background:#120e09;border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:12.5px;line-height:1.55;}
.ln{margin:1px 0;}
.ln.h{color:#9fd08f;}.ln.e{color:#e09393;}.ln.s{color:var(--brz2);}.ln.c{color:#ffd34d;}
.ln.q{color:#c9b8a0;font-style:italic;}
.bbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;}
#toasts{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:92vw;}
.toast{background:rgba(12,9,5,.95);color:var(--brz2);border:1px solid var(--bd);padding:7px 16px;border-radius:18px;font-size:13.5px;font-weight:600;animation:tin .2s,tout .3s 2.3s forwards;}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;}
#overlay.show{display:flex;}
#ovbox{background:linear-gradient(180deg,#241c10,#17110a);border:2px solid var(--bd);border-radius:16px;padding:18px;max-width:360px;width:100%;text-align:center;max-height:82vh;overflow-y:auto;}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#171208;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;font-size:13.5px;}
.opt.no{opacity:.45;cursor:not-allowed;}
.opt .c{color:var(--brz2);font-weight:700;white-space:nowrap;font-size:12.5px;}
.opt.dark{justify-content:center;color:var(--dim);}
.icard{border:2px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;background:#120e08;font-size:13px;}
.stchips{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap;}
.xpline{height:8px;background:#0d0a06;border:1px solid var(--bd);border-radius:4px;overflow:hidden;margin:6px 0 2px;}
.xpline>i{display:block;height:100%;background:linear-gradient(90deg,#4a7ab0,#7ab0e0);}
#err{position:fixed;bottom:0;left:0;right:0;background:#5c1414;color:#ffb0b0;font-size:12px;padding:8px 12px;display:none;z-index:99;white-space:pre-wrap;}
#err.show{display:block;}
.card,.icard,#ovbox,.scene{position:relative;border:2px solid #5a4726;border-radius:14px;box-shadow:0 0 0 1px #241a0c,0 6px 18px rgba(0,0,0,.65),inset 0 0 30px rgba(0,0,0,.55);background:linear-gradient(180deg,#2a2013 0%,#1c150c 60%,#150f08 100%);}
.card::before,.icard::before,.scene::before{content:'';position:absolute;inset:3px;border:1px solid rgba(201,163,92,.28);border-radius:10px;pointer-events:none;}
.card::after,.icard::after,.scene::after{content:'';position:absolute;top:6px;left:8px;width:9px;height:9px;background:radial-gradient(circle at 35% 35%,#e6c885,#7a5c22);border-radius:50%;box-shadow:0 0 4px rgba(230,200,133,.8);pointer-events:none;}
.divider{display:flex;align-items:center;gap:10px;max-width:460px;margin:14px auto 10px;color:var(--brz);}
.divider::before,.divider::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,transparent,#7a5c22,transparent);}
.divider span{font-size:13px;letter-spacing:2px;}
#ovbox.story{background:linear-gradient(180deg,#1b150c,#100b06);padding:22px 20px;}
.story .who{text-align:center;color:var(--brz2);font-weight:700;font-size:15px;letter-spacing:1.5px;margin-bottom:4px;}
.story .who small{display:block;color:var(--dim);font-weight:400;font-size:11px;letter-spacing:0;}
.story .txt{font-style:italic;color:#e3d6bd;font-size:14.5px;line-height:1.7;text-align:left;margin:12px 0;}
.story .hr{height:2px;background:linear-gradient(90deg,transparent,#7a5c22,transparent);margin:10px 0;}
.shopwrap{display:flex;gap:12px;max-width:680px;margin:0 auto;align-items:flex-start;flex-wrap:wrap;}
.shopcats{display:flex;flex-direction:column;gap:6px;flex-shrink:0;min-width:132px;}
.shopcats .subtab{text-align:left;}
.goods{flex:1;min-width:250px;}
@media (max-width:600px){.shopwrap{flex-direction:column-reverse;}.shopcats{flex-direction:row;flex-wrap:wrap;min-width:0;}}
</style>
</head>
<body>
<header>
  <div class="stats">
    <span class="chip">⛏ <b id="s_ore">0</b>/<span id="s_cap">0</span></span>

</header>
<main>

      <div style="text-align:center;margin-top:8px;"><button class="btn" data-act="buildany">🔨 Строить</button></div>
    </div>
  </section>
  <section class="view" id="v_raid"><div id="raidBox"></div></section>
  <section class="view" id="v_hero"><div id="heroBox"></div></section>

  <section class="view" id="v_more"><div id="moreBox"></div></section>
</main>
<div id="toasts"></div>
<div id="overlay"><div id="ovbox"></div></div>
<div id="err"></div>
<script>
'use strict';
var KEY='magnat_v9';
var RAR={1:{n:'Обычный',c:'#9a9a9a'},2:{n:'Необычный',c:'#7ed957'},3:{n:'Редкий',c:'#4aa3ff'},4:{n:'Эпический',c:'#b56cff'},5:{n:'Легендарный',c:'#ff4d4d'}};
var SLOTN={weapon:'Оружие',armor:'Доспех',helm:'Шлем',amulet:'Амулет',ring:'Кольцо',boots:'Сапоги',pack:'Рюкзак'};
var SLOTI={weapon:'⚔',armor:'🛡',helm:'⛑',amulet:'📿',ring:'💍',boots:'👢',pack:'🎒'};
var COSTB={mine:100,storage:200,barracks:300,forge:500,vent:800,altar:1000};
var NAMEB={mine:'Шахта',storage:'Склад',barracks:'Казарма',forge:'Кузница',vent:'Вентиляция',altar:'Алтарь глубин'};
var ICOB={mine:'⛏',storage:'📦',barracks:'🛡',forge:'⚒',vent:'🌬',altar:'🕯'};
var TIMEB={mine:30,storage:60,barracks:90,forge:120,vent:180,altar:240};
var DESCB={mine:'Камень ждёт. Добыча руды.',storage:'Больше руды вмещает склад.',barracks:'Отряд сильнее: +6 урона за уровень.',forge:'Здесь перековывали кирки деда. +5% урона за уровень.',vent:'Дыхание рудника. +10% добычи за уровень.',altar:'Здесь руду просили, а не брали. +2% к редкости лута.'};
var WEAPN=['Короткий меч','Топор рудокопа','Клинок ратника','Молот рудный','Резак сталелитый','Копьё тьмы','Секира костолом','Клинок эха','Разрушитель скал','Молот звёздного огня'];

var HELN=['Шапка рудокопа','Капюшон тьмы','Шлем ратника','Шлем глубин','Венец сталелитый'];

var AMUN=['Нитка с бусами','Амулет рудокопа','Талисман ратника','Око глубин','Слеза пещеры'];
var RINGN=['Кольцо медное','Кольцо рудокопа','Печатка ратника','Перстень глубин','Кольцо стража'];
var PACKN=['Мешок','Сума','Ранец','Уложение','Сундук путника'];
var ITEMS={};
(function(){
 var t,r;
 for(t=1;t<=10;t++){
  r=t<=2?1:(t<=4?2:(t<=6?3:(t<=8?4:5)));
  ITEMS['w'+t]={n:WEAPN[t-1],slot:'weapon',rar:r,atk:4+t*6,hp:0,def:0,lvl:Math.max(1,(t-1)*5),cur:'ore',price:Math.round(80*Math.pow(1.85,t-1))};

 }
 for(t=1;t<=5;t++){
  r=t===1?1:(t===2?2:(t===3?3:(t===4?4:5)));

  ITEMS['b'+t]={n:BOOTN[t-1],slot:'boots',rar:r,atk:0,hp:10+t*4,def:1+t*2,lvl:Math.max(1,(t-1)*10),cur:'ore',price:Math.round(60*Math.pow(2,t-1))};
  ITEMS['m'+t]={n:AMUN[t-1],slot:'amulet',rar:r,atk:1+t,hp:15+t*6,def:0,lvl:Math.max(1,(t-1)*10),cur:'ore',price:Math.round(120*Math.pow(2,t-1))};
  ITEMS['r'+t]={n:RINGN[t-1],slot:'ring',rar:r,atk:3+t*3,hp:0,def:0,lvl:Math.max(1,(t-1)*10),cur:'ore',price:Math.round(130*Math.pow(2,t-1))};
  ITEMS['p'+t]={n:PACKN[t-1],slot:'pack',rar:r,atk:0,hp:0,def:0,lvl:Math.max(1,(t-1)*10),cur:'ore',price:Math.round(200*Math.pow(1.9,t-1)),pack:6*t};
 }

 h+='<div class="icard"><b style="color:var(--brz2)">Луна над рудником: '+['тёмная','растущая','полная','убывающая'][moonPhase()]+'</b>';
 h+='<div class="muted">Сегодня Фекла скупает лут за '+fickleRate()+'% цены (лавка платит 40%).</div></div>';
 h+='<div class="opt" data-act="fickleSell"><span>💸 Продать весь обычный лут Фекле ('+fickleRate()+'%)</span></div>';
 h+='<div class="opt dark" style="font-style:italic;">«'+tip+'» — Фекла</div></div>';
 h+='<div class="card">';
 h+='<p class="sub">Версия v'+CHANGELOG.v+' «Голоса глубин». Код приглашения: <b id="refc">—</b></p>';
 h+='<button class="btn" data-act="changelog">📰 Журнал версий</button>';
 h+='<p style="margin:12px 0 2px;"><button class="btn" data-act="share">📤 Поделиться городом</button></p>';
 h+='<p style="margin:2px 0 2px;"><button class="btn red" data-act="reset">🗑 Сброс прогресса</button></p>';
 h+='</div>';
 mb.innerHTML=h;}
function showDiaryPage(pi){var ov=$('ovbox');
 var h='<div class="story"><div class="who">СТРАНИЦА '+(pi+1)+' · ДНЕВНИК ДЕДА<small>Мёртвый лес, рудник</small></div>';
 h+='<div class="hr"></div>';
 h+='<div class="txt" style="font-style:normal;">'+DIARY[pi]+'</div>';
 h+='<div class="opt dark" data-act="close">Закрыть</div></div>';
 ov.innerHTML=h;ov.classList.add('story');$('overlay').classList.add('show');}
function showChange(){var ov=$('ovbox');
 var h='<h3 style="color:var(--brz2);margin:0 0 6px;">📰 Журнал версий · v'+CHANGELOG.v+'</h3><div style="text-align:left;font-size:12.5px;color:var(--dim);">';
 for(var i=0;i<CHANGELOG.notes.length;i++)h+='<div class="ln">• '+CHANGELOG.notes[i]+'</div>';
 h+='</div><div class="opt dark" data-act="close">Закрыть</div>';
 ov.innerHTML=h;ov.classList.remove('story');$('overlay').classList.add('show');}
function maybeChange(){if(S.chVer!==CHANGELOG.v){S.chVer=CHANGELOG.v;save();showChange();}}
function checkStory(){var i;
 for(i=0;i<HERO_STORY.length;i++){var st=HERO_STORY[i];
  if(!S.storySeen[st.id]&&S.storyQueue.indexOf(st.id)<0){
   var ok=false;
   try{ok=st.cond();}catch(e){ok=false;}
   if(ok)S.storyQueue.push(st.id);}}
 if(S.storyQueue.length&&!BT)showNextStory();
 else maybeChange();}
function showNextStory(){if(!S.storyQueue.length){closeOv();maybeChange();return;}
 var id=S.storyQueue.shift();S.storySeen[id]=1;
 var st=null;var i;
 for(i=0;i<HERO_STORY.length;i++)if(HERO_STORY[i].id===id)st=HERO_STORY[i];
 if(!st){showNextStory();return;}
 var ov=$('ovbox');
 var h='<div class="who">'+st.who+'<small>'+st.sub+'</small></div>';
 h+='<div class="hr"></div>';
 h+='<div class="txt">'+st.txt+'</div>';
 h+='<div class="opt dark" data-act="storynext">Дальше ▶</div>';
 ov.innerHTML=h;ov.classList.add('story');$('overlay').classList.add('show');save();}
function fickleSell(){var rate=fickleRate();var sold=0,sum=0,i;
 for(i=S.bag.length-1;i>=0;i--){var it3=ITEMS[S.bag[i].id];
  if(it3.rar<=2){sum+=Math.floor(it3.price*rate/100);S.bag.splice(i,1);sold++;}}
 if(!sold){toast('Фекла: «Обычного лута нет. Не лезь с редким»');return;}
 S.ore=Math.min(cap(),S.ore+sum);
 toast('Фекла скупила '+sold+' предметов: +'+sum+' руды');
 renderAll();save();}
var pendingGift=false;
function giftDaily(){var day=Math.floor(Date.now()/86400000);
 if(S.giftDay===day)return;
 S.giftDay=day;
 var ore=100+Math.floor(S.floor*50);
 var pot=1;
 S.ore=Math.min(cap(),S.ore+ore);S.pot+=pot;
 if($('overlay').classList.contains('show')){pendingGift=true;save();return;}
 var ov=$('ovbox');
 var h='<div class="who">ДАР РУДНИКА<small>раз в сутки — рудник помнит своих</small></div>';
 h+='<div class="hr"></div>';
 h+='<div class="txt">Труба над шахтой просыпается первой. К вашему порогу скатился свёрток: '+ore+' руды и зелье. Записка чужим почерком: «Продолжай. За нами следят».</div>';
 h+='<div class="stchips"><span class="chip">⛏ +'+ore+'</span><span class="chip">🧪 +'+pot+'</span></div>';
 h+='<div class="opt dark" data-act="close">Забрать</div>';
 ov.innerHTML=h;ov.classList.add('story');$('overlay').classList.add('show');save();}
function afterOv(){if(pendingGift){pendingGift=false;giftDaily();}}
function renderAll(){
 try{renderStats();}catch(e){showErr(e.message);}
 try{renderGuide();}catch(e){showErr(e.message);}
 try{renderCity();}catch(e){showErr(e.message);}
 try{renderRaid();}catch(e){showErr(e.message);}
 try{renderHero();}catch(e){showErr(e.message);}
 try{renderShop();}catch(e){showErr(e.message);}
 try{renderMore();}catch(e){showErr(e.message);}}
function switchTab(v){
 var tabs=document.querySelectorAll('.tab');var i;
 for(i=0;i<tabs.length;i++)tabs[i].classList.toggle('active',tabs[i].dataset.v===v);
 var views=document.querySelectorAll('section.view');
 for(i=0;i<views.length;i++)views[i].classList.remove('active');
 var sec=$('v_'+v);if(!sec){showErr('Нет секции: '+v);return;}
 sec.classList.add('active');
 try{if(v==='raid')renderRaid();if(v==='hero')renderHero();if(v==='shop')renderShop();if(v==='more')renderMore();}catch(e){showErr(e.message);}}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;
 var act=el.dataset.act;
 if(act==='tab')switchTab(el.dataset.v);
 else if(act==='shopcat'){S.shopCat=el.dataset.v;renderShop();}
 else if(act==='hertab'){S.heroTab=el.dataset.v;renderHero();}
 else if(act==='raidtab'){S.raidTab=el.dataset.v;renderRaid();}
 else if(act==='cell'){var id=el.dataset.id;var b=S.buildings[id];
  if(!b)openBuild(id);
  else if(b.until)openSpeed(id);
  else openUpg(id);}
 else if(act==='buildany')openBuild(null);
 else if(act==='build')doBuild(el.dataset.t,el.dataset.cell);
 else if(act==='upg')doUpg(el.dataset.cell);
 else if(act==='speedup')doSpeed(el.dataset.cell);
 else if(act==='raid')startRaid(el.dataset.k);
 else if(act==='hit')battleStep();
 else if(act==='auto'){
  if(BT.timer){clearInterval(BT.timer);BT.timer=null;BT.auto=false;}
  else{BT.auto=true;BT.timer=setInterval(battleStep,1100);}
  renderBattle();}
 else if(act==='potion')usePotion();
 else if(act==='scrollbtn')useScroll();
 else if(act==='buy')buyItem(el.dataset.k);
 else if(act==='buyab')buyAb(el.dataset.k);
 else if(act==='buypot'){if(S.ore<60){toast('Мало руды');return;}S.ore-=60;S.pot++;renderAll();save();toast('🧪 Зелье куплено');}
 else if(act==='buyscroll'){if(S.ore<180){toast('Мало руды');return;}S.ore-=180;S.scroll++;renderAll();save();toast('📜 Свиток куплен');}
 else if(act==='buyspd'){if(S.star<120){toast('Мало звёзд');return;}S.star-=120;S.spd+=5;renderAll();save();toast('⚡ +5 ускорений');}
 else if(act==='item')openItem(el.dataset.u,el.dataset.src,el.dataset.slot);
 else if(act==='equip')doEquip(el.dataset.u);
 else if(act==='unequip')doUnequip(el.dataset.slot);
 else if(act==='sell')doSell(el.dataset.u);
 else if(act==='drop')doDrop(el.dataset.u);
 else if(act==='selljunk'){var sold=0,sum=0,i;
  for(i=S.bag.length-1;i>=0;i--){var it3=ITEMS[S.bag[i].id];
   if(it3.rar<=2){sum+=Math.floor(it3.price*0.4);S.bag.splice(i,1);sold++;}}
  if(!sold){toast('Обычного лута нет — продавать редкое не дам');}
  else{S.ore=Math.min(cap(),S.ore+sum);
   toast('Сдано '+sold+' предметов: +'+sum+' руды');
   renderAll();save();}}
 else if(act==='fickleSell')fickleSell();
 else if(act==='diaryPage')showDiaryPage(+el.dataset.p);
 else if(act==='changelog')showChange();
 else if(act==='storynext'){if(S.storyQueue.length)showNextStory();else{closeOv();afterOv();maybeChange();}}
 else if(act==='filter'){S.bagF=el.dataset.f;renderHero();}
 else if(act==='noslot')toast('Слот пуст — наденьте предмет из рюкзака');
 else if(act==='close'){closeOv();afterOv();}
 else if(act==='noop')toast('Недоступно: не хватает ресурсов или уровня');
 else if(act==='share'){var txt='Мой подземный рудник — этаж '+S.floor+'! Герой ур.'+S.hero.lvl+'. Залетай: t.me/your_bot?start=ref01';
  if(navigator.share)navigator.share({text:txt}).catch(function(){});
  else{if(navigator.clipboard)navigator.clipboard.writeText(txt);toast('Ссылка скопирована');}}
 else if(act==='reset'){if(confirm('Сбросить весь прогресс?')){
  localStorage.removeItem(KEY);S=freshS();renderAll();save();checkStory();}}
});
function closeOv(){$('overlay').classList.remove('show');}
function buyItem(k){var d=ITEMS[k];
 if(S.hero.lvl<d.lvl){toast('🔒 Нужен уровень '+d.lvl);return;}
 if(S.bag.length>=bagMax()){toast('Рюкзак полон');return;}
 if(d.cur==='ore'){if(S.ore<d.price){toast('Мало руды ('+d.price+')');return;}S.ore-=d.price;}
 else{if(S.star<d.price){toast('Мало звёзд ('+d.price+'⭐)');return;}S.star-=d.price;}
 S.bag.push({u:S.uid++,id:k});
 toast((d.cur==='star'?'🌑 Куплено: ':'Куплено: ')+d.n);
 renderAll();save();}
function buyAb(k){var i;for(i=0;i<ABIL.length;i++){var ab=ABIL[i];if(ab.id!==k)continue;
 if(S.abil[k])return;
 if(ab.cur==='ore'){if(S.ore<ab.price){toast('Мало руды');return;}S.ore-=ab.price;}
 else{if(S.star<ab.price){toast('Мало звёзд');return;}S.star-=ab.price;}
 S.abil[k]=1;toast('✨ Способность изучена: '+ab.n);}
 renderAll();save();}
function tick(){var now=Date.now();
 var id,b,done=false;
 for(id in S.buildings){b=S.buildings[id];
  if(b.until&&now>=b.until){b.until=0;if(b.newLvl){b.lvl=b.newLvl;delete b.newLvl;}
   done=true;addXp(5);qAdd('builds',1);checkAch();
   toast('✔ '+NAMEB[b.t]+' готова! '+({forge:'Металл вспомнил форму.',vent:'Рудник вздохнул.',altar:'Глубины приняли дар.'}[b.t]||''));}}
 if(done)renderCity();
 var gain=oreRate()*0.25;
 S.ore=Math.min(cap(),S.ore+gain);
 qAdd('oreGot',gain);
 if(Math.random()<0.003&&oreRate()>0){
  var ids=Object.keys(S.buildings);
  if(ids.length){var host=ids[Math.floor(Math.random()*ids.length)];
   var cell=document.querySelector('[data-id="'+host+'"]');
   if(cell&&!cell.querySelector('.spark')){var sp=document.createElement('div');
    sp.className='spark';sp.onclick=function(ev){ev.stopPropagation();
     var bonus=Math.floor(Math.random()*40)+15;
     S.ore=Math.min(cap(),S.ore+bonus);toast('✨ +'+bonus+' руды');
     sp.remove();renderStats();save();};
    cell.appendChild(sp);
    setTimeout(function(){if(sp.parentNode)sp.remove();},90000);}}}
 renderStats();
 if(now-S._sv>20000){S._sv=now;save();}}
setInterval(function(){
 var rb=$('v_raid');if(!rb||!rb.classList.contains('active')||BT)return;
 var busy=Date.now()<S.raidCdUntil;
 var bs=document.querySelectorAll('[data-act="raid"]');var i;
 for(i=0;i<bs.length;i++){
  if(busy){if(!bs[i].disabled){bs[i].disabled=true;
   bs[i].textContent='Отряд в пути ('+Math.ceil((S.raidCdUntil-Date.now())/60000)+' мин)';}}
  else if(bs[i].disabled){bs[i].disabled=false;renderRaid();}}
},1000);
function welcome(){var gone=(Date.now()-S.lastSeen)/3600000;
 if(gone>0.25&&oreRate()>0){
  var mins=Math.min(240,gone*60);
  var got=Math.floor(oreRate()*60*mins);
  if(got>0){S.ore=Math.min(cap(),S.ore+got);
   setTimeout(function(){toast('⛏ Пока вас не было, добыто '+got+' руды');},500);}}
 S.lastSeen=Date.now();}
load();welcome();renderAll();
$('refc').textContent='ref'+(1000+Math.floor(Math.random()*9000));
checkStory();
giftDaily();
setInterval(tick,250);
setInterval(function(){S.lastSeen=Date.now();save();},60000);
</script>
</body>
</html>
