}35%{transform:scale(1.05);opacity:1}100%{transform:scale(1.5);opacity:0}}@keyframes ringspin{to{stroke-dashoffset:-80}}@keyframes chainhang{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}@keyframes bannerwave{0%,100%{transform:skewY(-1.6deg)}50%{transform:skewY(1.6deg)}}@keyframes cartrock{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}@keyframes dripglow{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(13px);opacity:0}}@keyframes wingsl{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.3)}}@keyframes podiumup{0%{transform:translateY(9px);opacity:0}70%,100%{transform:translateY(0);opacity:1}}@keyframes dash{to{stroke-dashoffset:-28}}

function def(){return{ore:150,stars:0,energy:3,floor:1,lvl:1,xp:0,wins:0,army:0,bld:[{i:'rat',lv:1,fin:0}],pot:0,blade:0,helm:0,mined:0,qd:0,diary:0,dl:'',stk:0,eT:Date.now(),t:Date.now(),tab:'city',sub:'norm',exp:0}}
function load(){try{var s=localStorage.getItem('dd4');if(s)S=JSON.parse(s)}catch(e){}if(!S||!S.bld)S=def();var dt=Math.min(28800,(Date.now()-(S.t||Date.now()))/1000),o=Math.min(Math.max(0,limit()-S.ore),rate()*dt);if(o>0)S.ore+=o;while(Date.now()-S.eT>=9e5){S.eT+=9e5;if(S.energy<15)S.energy++}}
function save(){S.t=Date.now();try{localStorage.setItem('dd4',JSON.stringify(S))}catch(e){}}
function lv(id){return S.bld.reduce(function(a,b){return a+(b&&b.i==id?b.lv:0)},0)}
function has(id){return lv(id)>0}
function rate(){return lv('mine')*2*(1+.1*lv('vent'))}
function limit(){return 500+250*lv('wh')}
function atk(){return Math.round((10+S.army*5+(S.blade?10:0))*(1+.05*lv('smith')))}
function hpm(){return 100+S.army*10+(S.helm?20:0)}
function amul(){return 1+.02*lv('altar')}
function gain(x,tr){S.ore=Math.min(limit(),S.ore+x);if(tr)S.mined+=x}
function fmt(n){return Math.floor(n).toLocaleString('ru-RU')}
function addXp(x){S.xp+=x;while(S.xp>=S.lvl*250){S.xp-=S.lvl*250;S.lvl++;S.energy=Math.min(15,S.energy+2);toast('НОВЫЙ УРОВЕНЬ! Ур. '+S.lvl,'var(--green)')}}
function toast(txt,c){var w=document.getElementById('tst'),d=document.createElement('div');d.className='toast';d.style.borderColor=c;d.style.color=c;d.textContent=txt;w.appendChild(d);setTimeout(function(){d.remove()},2700)}
var TABS=[['city','Город'],['raid','Поход'],['hero','Герой'],['shop','Лавка'],['quest','Задания']];
function header(){return '<div class="pill"><span class="chip">'+SV.pick()+'<b>'+fmt(S.ore)+'</b>/'+fmt(limit())+'</span><span class="chip">'+SV.star()+'<b>'+S.stars+'</b></span><span class="chip">'+SV.bolt()+'<b>'+S.energy+'</b></span><span class="chip">Этаж <b>'+S.floor+'</b></span><span class="chip">Ур. <b>'+S.lvl+'</b></span></div><nav>'+TABS.map(function(t){return '<button class="'+(S.tab==t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'</nav>'}
function setTab(t){S.tab=t;render()}
function setSub(s){S.sub=s;render()}
function render(){var f={city:rCity,raid:rRaid,hero:rHero,shop:rShop,quest:rQuest}[S.tab]||rCity;document.getElementById('app').innerHTML=header()+f()}
function rCity(){var now=Date.now(),h='<div class="cityh"><span>⛏ ВАШ ГОРОД · ЭТАЖ <b>'+S.floor+'</b></span><button class="btn sm" onclick="buildPick()">Строить</button></div><div class="panel"><div class="grid5">';
for(var i=0;i<20;i++){var b=S.bld[i];
if(!b){h+='<div class="cell" onclick="buildPick('+i+')"><span class="pl">+</span></div>';continue}
var d=DEF[b.i]||DEF.rat;
if(b.lv==0&&b.fin){var rem=Math.max(1,Math.ceil((b.fin-now)/1000)),pr=Math.min(100,Math.round(100*(1-(b.fin-now)/((b.tt||d.t)*1000))));
h+='<div class="cell full" onclick="tapB('+i+')">'+SV[b.i]()+'<span class="hr">⏳</span><span class="lv">'+rem+'с</span><span class="bnm">'+d.n+'</span><div class="bprog"><i style="width:'+pr+'%"></i></div></div>'}
else h+='<div class="cell full" onclick="tapB('+i+')">'+SV[b.i]()+'<span class="lv">ур.'+b.lv+'</span><span class="bnm">'+d.n+'</span></div>'}
h+='</div><div class="army"><h4>⛏ Армия: '+S.army+' / 30</h4><p>Каждый воин: +5 Атаки и +10 HP Герою.</p>'+(has('bar')?'<button class="btn" onclick="hire()">Нанять воина (250 руды)</button>':'<p style="color:var(--blood)">Нужна казарма</p>')+'</div><div class="foot">Добыча: <b>'+rate().toFixed(1)+'/с</b> · Лимит: <b>'+fmt(limit())+'</b> · Отряд: '+SV.pick()+'<b>'+atk()+'</b></div></div>';
return h}
function buildPick(i){if(i==null){i=-1;for(var k=0;k<20;k++){if(!S.bld[k]){i=k;break}}if(i<0){toast('Нет свободных мест','var(--blood)');return}}
var h='<h3>Что строим?</h3>';
GN.forEach(function(g,gi){h+='<div class="cat">'+g+'</div>';GO[gi].forEach(function(id){var d=DEF[id],off=d.l||S.ore<d.c;
h+='<div class="mitem'+(off?' off':'')+'"'+(off?'':' onclick="startBuild('+i+',\''+id+'\')"')+'>'+SV[id]()+'<div><div class="tt">'+d.n+(d.l?' <span style="opacity:.5">(в будущем)</span>':'')+'</div><div class="dd">'+d.d+'</div></div><div class="cc">'+d.c+' р.<small>'+d.t+' с</small></div></div>'})});
openModal(h)}
function startBuild(i,id){var d=DEF[id];if(S.ore<d.c){toast('Не хватает руды','var(--blood)');return}S.ore-=d.c;S.bld[i]={i:id,lv:0,tt:d.t,fin:Date.now()+d.t*1000};closeModal();save();render();toast('Стройка началась: '+d.n,'var(--gold)')}
function tapB(i){var b=S.bld[i],d=DEF[b.i]||DEF.rat;
if(b.lv==0&&b.fin){var rem=Math.ceil((b.fin-Date.now())/1000),need=Math.max(1,Math.ceil(rem/30));
openModal('<h3>Стройка · '+d.n+'</h3><p class="ln" style="text-align:center">Осталось '+rem+' с</p><button class="btn" onclick="acc('+i+','+need+')">Ускорить за '+need+'⚡</button><button class="btn gray" style="margin-top:8px" onclick="closeModal()">Ждать</button>');return}
var cost=Math.max(50,Math.round(d.c*0.8*b.lv)),t=Math.max(10,Math.round(d.t*0.6*b.lv));
openModal('<h3>'+d.n+' · ур.'+b.lv+'</h3><p class="ln" style="text-align:center;opacity:.8">'+d.d+'</p><p class="ln" style="text-align:center">Улучшить до ур.'+(b.lv+1)+': <b style="color:var(--gold2)">'+cost+' руды</b> · '+t+' с</p><button class="btn" onclick="upB('+i+','+cost+','+t+')">Улучшить</button><button class="btn gray" style="margin-top:8px" onclick="closeModal()">Отмена</button>')}
function upB(i,c,t){if(S.ore<c){toast('Не хватает руды','var(--blood)');return}S.ore-=c;var b=S.bld[i];b.lv=0;b.tt=t;b.fin=Date.now()+t*1000;closeModal();save();render();toast('Улучшение началось','var(--gold)')}
function acc(i,n){if(S.energy<n){toast('Мало энергии','var(--blood)');return}S.energy-=n;S.bld[i].fin=Date.now();closeModal();save();render()}
function hire(){if(!has('bar')){toast('Сначала построй казарму','var(--blood)');return}if(S.army>=30){toast('Армия полна (30)','var(--blood)');return}if(S.ore<250){toast('Не хватает руды','var(--blood)');return}S.ore-=250;S.army++;save();render();toast('Воин нанят: +5⚔ +10❤','var(--green)')}
function rRaid(){var h='<h3 style="text-align:center;color:var(--gold);font-size:20px;margin:4px 0 10px">⛏ Поход</h3><div class="subs">',k;
for(k in SUB)h+='<button class="'+(S.sub==k?'on':'')+'" onclick="setSub(\''+k+'\')">'+SUB[k]+'</button>';
h+='</div>';
if(S.sub=='exp')h+=expCard();
else{EN[S.sub].forEach(function(e,i){h+=rcard(e,i)});
if(S.floor%5==0)h+=rcard({n:'💀 Страж Раны',a:60+S.floor*4,h:1200+S.floor*80,c:0,o:2000,s:40,x:500,t:'skull'},9);
h+='<div class="raidc lockc"><h3>🔒 Бездна</h3><p class="ln" style="opacity:.7">Откроется на уровне героя 15.</p></div><div class="raidc lockc"><h3>🔒 Затопленный ярус</h3><p class="ln" style="opacity:.7">Откроется на уровне героя 20.</p></div>';
h+='<p style="text-align:center;opacity:.85">Побед: <b style="color:var(--gold2)">'+S.wins+'</b> · До нового этажа: '+(5-S.wins%5)+' побед</p>'}
return h}
function rcard(e,idx){var ch=Math.max(40,Math.min(97,Math.round(50+atk()-e.a)));
return '<div class="raidc"><h3>'+e.n+'</h3><p class="ln">Отряд: '+SV.pick()+atk()+' · <span style="color:var(--blood)">♥'+hpm()+'</span></p><p class="ln">Враг: '+SV.pick()+e.a+' · <span style="color:var(--blood)">♥'+e.h+'</span></p><div class="cbar"><i style="width:'+ch+'%"></i></div><p class="ln">Шанс ~'+ch+'% · Награда: '+e.o+' руды + '+e.s+'★</p><button class="btn'+(S.ore<e.c?' gray" disabled':'')+'" onclick="fight('+idx+')">В бой!'+(e.c?' (−'+e.c+' руды)':'')+'</button></div>'}
function fight(idx){var e=idx==9?{n:'💀 Страж Раны',a:60+S.floor*4,h:1200+S.floor*80,c:0,o:2000,s:40,x:500,t:'skull'}:EN[S.sub][idx];
if(S.ore<e.c){toast('Не хватает руды ('+e.c+')','var(--blood)');return}S.ore-=e.c;B={e:e,ph:hpm(),eh:e.h,msg:'Выбери действие.',busy:0};save();drawB()}
function expCard(){var btn;
if(!S.exp)btn='<button class="btn" onclick="startExp()">Отправить отряд</button>';
else if(Date.now()-S.exp>=18e4)btn='<button class="btn" onclick="claimExp()">Забрать награду (120 руды + 2★)</button>';
else btn='<button class="btn gray" disabled>Отряд в пути ('+Math.max(1,Math.ceil((18e4-(Date.now()-S.exp))/6e4))+' мин)</button>';
return '<div class="raidc"><h3>Разведка</h3><p class="ln">Отряд: '+SV.pick()+atk()+' · <span style="color:var(--blood)">♥'+hpm()+'</span></p><p class="ln">Враг: Крысолюд-разведчик '+SV.pick()+'17 · <span style="color:var(--blood)">♥180</span></p><div class="cbar"><i style="width:97%"></i></div><p class="ln">Шанс ~97% · Награда: 120 руды + 2★</p>'+btn+'</div>'}
function startExp(){S.exp=Date.now();save();render();toast('Отряд отправлен (3 мин)','var(--gold)')}
function claimExp(){if(!S.exp||Date.now()-S.exp<18e4)return;S.exp=0;gain(120,1);S.stars+=2;addXp(60);if(Math.random()<.12){S.diary++;toast('📜 Найдена страница дневника','var(--gold)')}save();render();toast('Разведка удалась: +120 руды +2★','var(--gold2)')}
function drawB(){var ov=document.getElementById('ov');if(!B){ov.classList.remove('on');ov.innerHTML='';return}
ov.classList.add('on');var e=B.e,pw=Math.round(B.ph/hpm()*100),ew=Math.round(B.eh/e.h*100),b;
if(B.state=='won')b='<h3 style="color:var(--gold2)">ПОДЗЕМЕЛЬЕ ПРОЙДЕНО!</h3><div style="margin:8px 0">'+SV[e.t]()+'</div><p class="ln" style="text-align:center">Награда: <b style="color:var(--gold2)">+'+B.ro+' руды</b> · +'+e.s+'★ · +'+e.x+' опыта</p><button class="btn" onclick="endB()">Продолжить</button>';
else if(B.state=='lost')b='<div style="margin:8px 0">'+SV[e.t]()+'</div><h3>ТЕМНОТА ПОБЕДИЛА</h3><button class="btn red" style="margin-top:10px" onclick="endB()">ПОВТОРИТЬ ПОХОД</button>';
else b='<h3>БОЙ · '+e.n+'</h3><div class="ftr"><div style="flex:1">'+SV.hero()+'<div class="hbar"><i style="width:'+pw+'%;background:var(--green)"></i></div><p style="text-align:center;font-size:11px">❤ '+B.ph+'/'+hpm()+' · ⚔ '+atk()+'</p></div><b style="align-self:center;opacity:.5">VS</b><div style="flex:1">'+SV[e.t]()+'<div class="hbar"><i style="width:'+ew+'%;background:var(--blood)"></i></div><p style="text-align:center;font-size:11px">❤ '+B.eh+'/'+e.h+' · ⚔ '+e.a+'</p></div></div><div class="bmsg">'+B.msg+'</div><div style="display:flex;gap:8px"><button class="btn red" style="flex:2" onclick="pHit()">⚔ АТАКА</button><button class="btn gray" style="flex:1" onclick="bHeal()">🧪 '+S.pot+'</button><button class="btn" style="flex:1" onclick="bUlt()">⚡×3</button></div>';
ov.innerHTML='<div class="ovbox">'+b+'</div>'}
function pHit(m){if(!B||B.state||B.busy)return;var crit=Math.random()<.2,d=Math.round(atk()*(0.8+Math.random()*0.4)*(m||1)*(crit?2:1));B.eh=Math.max(0,B.eh-d);B.msg=crit?'⚔ КРИТ! Ты нанёс −'+d:'Ты нанёс −'+d;drawB();if(B.eh<=0){winB();return}B.busy=1;setTimeout(function(){if(!B||B.state)return;var ed=Math.round(B.e.a*(0.8+Math.random()*0.4));B.ph=Math.max(0,B.ph-ed);B.msg='Враг отвечает: −'+ed+' тебе';B.busy=0;drawB();if(B.ph<=0){B.state='lost';drawB()}},750)}
function bHeal(){if(!B||B.state||B.busy)return;if(S.pot<1){toast('Нет зелий — купи в Лавке','var(--blood)');return}S.pot--;B.ph=Math.min(hpm(),B.ph+50);B.msg='🧪 Зелье выпито: +50 HP';drawB();B.busy=1;setTimeout(function(){if(!B||B.state)return;var ed=Math.round(B.e.a*(0.8+Math.random()*0.4));B.ph=Math.max(0,B.ph-ed);B.msg='Враг отвечает: −'+ed+' тебе';B.busy=0;drawB();if(B.ph<=0){B.state='lost';drawB()}},750)}
function bUlt(){if(!B||B.state||B.busy)return;if(S.energy<3){toast('Нужно 3⚡','var(--blood)');return}S.energy-=3;pHit(3)}
function winB(){var e=B.e;B.ro=Math.round(e.o*amul());gain(B.ro,1);S.stars+=e.s;addXp(e.x);S.wins++;if(S.wins%5==0)S.floor++;if(Math.random()<.12){S.diary++;setTimeout(function(){toast('📜 Найдена страница дневника','var(--gold)')},1200)}B.state='won';save();drawB()}
function endB(){B=null;var ov=document.getElementById('ov');ov.classList.remove('on');ov.innerHTML='';save();render()}
function rHero(){return '<div class="panel" style="text-align:center"><div style="width:130px;margin:0 auto">'+SV.hero()+'</div><h3 style="color:var(--gold2);margin:6px 0">Шахтёр · Ур. '+S.lvl+'</h3><p class="ln">⚔ <b>'+atk()+'</b> · 🛡 <b>'+(10+2*lv('bar'))+'</b> · ❤ <b>'+hpm()+'</b></p><p class="ln" style="opacity:.85">Опыт: '+S.xp+' / '+S.lvl*250+'</p><div class="cbar"><i style="width:'+Math.min(100,S.xp/(S.lvl*250)*100)+'%"></i></div></div><div class="panel"><div class="cat">✦ Снаряжение</div><div class="mitem"><div class="tt">✦ Стальной клинок</div><div class="dd">'+(S.blade?'эпик · +10 атака':'не найден')+'</div></div><div class="mitem"><div class="tt">⬡ Шлем стражи</div><div class="dd">'+(S.helm?'редкий · +20 HP':'не найден')+'</div></div><div class="cat">Хроника</div><p class="ln">Побед: <b>'+S.wins+'</b> · Этаж: <b>'+S.floor+'</b> · Армия: <b>'+S.army+'/30</b></p><p class="ln">Страниц дневника: <b>'+S.diary+'</b></p></div>'}
function rShop(){var h='<h3 style="text-align:center;color:var(--gold);font-size:20px;margin:4px 0 10px">🏪 Лавка</h3>';
[{n:'Зелье лечения',d:'Восстанавливает 50 HP в бою.',c:'250 р.',buy:'buyPot()'}, {n:'Мешок руды',d:'+200 руды сразу.',c:'2⚡',buy:'buyBag()'}, {n:'Стальной клинок',d:'+10 к атаке.',c:'12⚡',buy:'buyBlade()',own:S.blade}, {n:'Шлем стражи',d:'+20 к макс. HP.',c:'8⚡',buy:'buyHelm()',own:S.helm}].forEach(function(s){
h+='<div class="mitem'+(s.own?' off':'')+'"><div><div class="tt">'+s.n+'</div><div class="dd">'+s.d+'</div></div><div class="cc">'+(s.own?'✓ куплено':s.c)+'</div></div><button class="btn'+(s.own?' gray" disabled':'')+'" onclick="'+s.buy+'">КУПИТЬ</button><div style="height:10px"></div>'});
return h}
function buyPot(){if(S.ore<250){toast('Не хватает руды','var(--blood)');return}S.ore-=250;S.pot++;save();render();toast('Зелье куплено','var(--green)')}
function buyBag(){if(S.energy<2){toast('Мало энергии','var(--blood)');return}S.energy-=2;gain(200,1);save();render();toast('+200 руды','var(--gold2)')}
function buyBlade(){if(S.blade)return;if(S.energy<12){toast('Мало энергии','var(--blood)');return}S.energy-=12;S.blade=1;save();render();toast('Стальной клинок · эпик!','var(--gold)')}
function buyHelm(){if(S.helm)return;if(S.energy<8){toast('Мало энергии','var(--blood)');return}S.energy-=8;S.helm=1;save();render();toast('Шлем стражи · редкий!','var(--blue)')}
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
var DRW=[{o:5},{o:8},{e:1},{o:12},{o:25,e:1},{o:50,e:2}];
function rQuest(){var cl=S.dl==dkey(Date.now()),ni=S.streak%6,ci=(S.streak-1+6)%6;
var g='<div class="qgrid">';for(var i=0;i<6;i++){var r=DRW[i],lb='Д'+(i+1)+'<br>'+(r.e?(r.o?r.e+'⚡+'+r.o:r.e+'⚡'):r.o+'⛏');g+='<div class="qd'+(cl&&i==ci?' cl':(!cl&&i==ni?' cur':''))+'">'+lb+'</div>'}g+='</div>';
var btn=cl?'<button class="btn gray" disabled>Уже забрано сегодня · вернётся завтра</button>':'<button class="btn" onclick="claimDaily()">ЗАБРАТЬ НАГРАДУ</button>';
var pr=Math.min(100,S.mined/2);
var q=S.qd?'<div class="raidc"><h3>⛏ Квест дня</h3><p class="ln" style="color:var(--green)">✓ выполнено — 200/200</p></div>':'<div class="raidc"><h3>⛏ Добыть 200 руды в походах</h3><p class="ln">Награда: 3⚡ + 150 руды</p><div class="cbar"><i style="width:'+pr+'%"></i></div><p class="ln">Прогресс: '+Math.min(200,S.mined)+'/200</p>'+(S.mined>=200?'<button class="btn" onclick="claimQuest()">ЗАБРАТЬ НАГРАДУ</button>':'')+'</div>';
var rows=[['Гном-Легенда',42,98200],['Тёмный Кирилл',38,87340],['Кирка Судьбы',35,76050],['Мрак',29,54100],['Копай-Копай',22,31800],['Ты',S.lvl,Math.floor(S.ore)]].sort(function(a,b){return b[2]-a[2]});
var md=['🥇','🥈','🥉','4.','5.','6.'];
return '<h3 style="text-align:center;color:var(--gold);font-size:20px;margin:4px 0 10px">📋 Задания</h3><div class="panel"><div class="cat">✦ Ежедневная награда</div>'+g+btn+'</div>'+q+'<div class="panel"><h3 style="color:var(--gold);text-align:center;margin-bottom:6px">🏆 ЛИДЕРЫ ГЛУБИН</h3>'+rows.map(function(r,i){return '<p class="ln">'+md[i]+' <b style="color:'+(r[0]=='Ты'?'var(--gold2)':'var(--bone)')+'">'+r[0]+'</b> · Ур.'+r[1]+' · '+fmt(r[2])+'</p>'}).join('')+'</div>'}
function claimDaily(){var t=dkey(Date.now());if(S.dl==t)return;S.stk=(S.dl==dkey(Date.now()-864e5))?S.stk+1:1;S.dl=t;var r=DRW[(S.stk-1)%6];if(r.o)gain(r.o,1);if(r.e)S.energy=Math.min(15,S.energy+r.e);save();render();toast('День '+S.stk+': награда забрана!','var(--gold2)')}
function claimQuest(){if(S.qd||S.mined<200)return;S.qd=1;S.energy=Math.min(15,S.energy+3);gain(150,0);save();render();toast('Квест: +3⚡ +150 руды','var(--green)')}
function openModal(h){MOD=1;document.getElementById('mod').innerHTML='<div class="ov on" onclick="if(event.target===this)closeModal()"><div class="ovbox">'+h+'</div></div>'}
function closeModal(){MOD=0;document.getElementById('mod').innerHTML=''}
function tick(){var t=Date.now(),dt=(t-lastT)/1000;lastT=t;
S.bld.forEach(function(b){if(b&&b.lv==0&&b.fin&&b.fin<=t){b.lv=1;b.fin=0;toast('Построено: '+(DEF[b.i]||DEF.rat).n,'var(--green)')}});
if(rate()>0)S.ore=Math.min(limit(),S.ore+rate()*dt);
while(t-S.eT>=9e5){S.eT+=9e5;if(S.energy<15)S.energy++}
save();if(!B&&!MOD)render()}
load();render();
setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){if(document.hidden)save()});
</script></body></html>
