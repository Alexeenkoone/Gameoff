<style>
:root{--bg:#0e0b08;--panel:#1c1610;--panel2:#261d12;--brz:#c9a35c;--brz2:#e6c885;--tx:#e8ddc8;--dim:#8f8270;--bd:#3a2f1e;--dgr:#ff5252;--grn:#7ed957;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;height:100vh;overflow:hidden;background:linear-gradient(180deg,#17110a,#0b0805);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;display:flex;flex-direction:column;}
header{flex-shrink:0;background:linear-gradient(180deg,#241c12,#1a140c);border-bottom:2px solid var(--bd);padding:7px 8px;display:flex;align-items:center;gap:8px;overflow-x:auto;}
.stats{display:flex;gap:4px;flex-shrink:0;}
.chip{background:#0f0b07;border:1px solid var(--bd);border-radius:12px;padding:3px 7px;font-size:12px;white-space:nowrap;}
.chip b{color:var(--brz2);}
nav{flex:1;display:flex;gap:5px;min-width:290px;}
.tab{flex:1;padding:8px 3px;text-align:center;font-size:12px;cursor:pointer;background:#0f0b07;border:1px solid var(--bd);border-radius:9px;color:var(--dim);}
.tab.active{background:linear-gradient(180deg,#c9a35c,#9c7b3c);color:#1a1206;font-weight:700;border-color:var(--brz);}
main{flex:1;overflow-y:auto;padding:10px 10px 30px;}
.view{display:none;}
.view.active{display:block;}
#guide{display:none;margin:0 auto 10px;max-width:560px;padding:8px 12px;border-radius:20px;background:rgba(201,163,92,.12);border:1px solid rgba(201,163,92,.55);color:var(--brz2);font-size:12.5px;text-align:center;}
#guide.show{display:block;}
#guide .gbtn{display:inline-block;margin-left:8px;padding:3px 12px;border-radius:12px;background:#c9a35c;color:#1a1206;font-weight:700;cursor:pointer;font-size:12px;}
h2{color:var(--brz2);text-align:center;margin:4px 0 10px;font-size:19px;text-shadow:0 0 12px rgba(201,163,92,.4);}
.scene{max-width:560px;margin:0 auto;border:2px solid #4a3a20;border-radius:16px;background:radial-gradient(ellipse at 50% 0%,#221a10 0%,#120d07 70%);padding:10px 12px 12px;box-shadow:0 0 24px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.5);}
.scene-title{text-align:center;color:var(--brz2);font-weight:700;margin-bottom:8px;font-size:14px;letter-spacing:.5px;}

#city{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.cell{position:relative;aspect-ratio:1;background:#171208;border:2px dashed #3d2f18;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

.cell .plus{color:#4d3f26;font-size:20px;font-weight:700;}
.bld{position:absolute;inset:3px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;text-align:center;padding:2px;}
.bld .ico{font-size:20px;}
.bld .lvl{position:absolute;top:2px;right:4px;font-size:9px;background:#000;border:1px solid var(--bd);border-radius:5px;padding:0 4px;color:var(--brz2);}
.bld .pbar{position:absolute;bottom:4px;left:4px;right:4px;height:4px;background:#000;border-radius:2px;overflow:hidden;}

.bld.mine{background:linear-gradient(180deg,#243018,#171a0d);border:1px solid #4d5c2a;}
.bld.storage{background:linear-gradient(180deg,#332a12,#1d1708);border:1px solid #6a5628;}
.bld.barracks{background:linear-gradient(180deg,#331c12,#1d0f08);border:1px solid #6a3c28;}
.spark{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff;z-index:5;cursor:pointer;animation:pu 1.1s infinite alternate;}

.card .sub{color:var(--dim);font-size:12.5px;margin-bottom:6px;}
.bar2{height:9px;background:#0d0a06;border:1px solid var(--bd);border-radius:5px;overflow:hidden;margin:7px 0;}

.btn{background:linear-gradient(180deg,#c9a35c,#9c7b3c);border:1px solid #e6c885;color:#1a1206;font-weight:700;padding:9px 20px;border-radius:9px;cursor:pointer;font-size:14px;}

.btn.red{background:linear-gradient(180deg,#8a3030,#5c1f1f);color:#ffd9d9;border-color:#8a3030;}

.subtabs{display:flex;gap:6px;max-width:560px;margin:0 auto 12px;overflow-x:auto;padding-bottom:2px;}
.subtab{flex-shrink:0;padding:7px 13px;font-size:12.5px;cursor:pointer;background:#0f0b07;border:1px solid var(--bd);border-radius:9px;color:var(--dim);}
.subtab.active{background:#3a2c14;color:var(--brz2);border-color:var(--brz);font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:560px;margin:0 auto;}
.itm{position:relative;background:#171208;border:2px solid var(--bd);border-radius:10px;padding:8px 9px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px;text-align:left;}
.itm .ic{font-size:22px;flex-shrink:0;}
.itm .mid{flex:1;min-width:0;}
.itm .nm{font-weight:600;font-size:12.5px;}
.itm .st{color:var(--dim);font-size:11px;}
.itm .pr{color:var(--brz2);font-weight:700;font-size:12px;white-space:nowrap;text-align:right;}

.ghead{color:var(--brz2);font-size:13px;font-weight:700;margin:14px 2px 6px;max-width:560px;}
.doll{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:460px;margin:0 auto;}
.slot{position:relative;aspect-ratio:.85;background:#151009;border:2px solid #3a2f1e;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9px;color:var(--dim);padding:3px;text-align:center;box-shadow:inset 0 0 10px rgba(0,0,0,.5);}
.slot .ic{font-size:20px;opacity:.45;}
.slot.full .ic{opacity:1;filter:drop-shadow(0 0 4px rgba(201,163,92,.7));}

.slot .snq{font-size:8.5px;font-weight:700;}

#err.show{display:block;}
</style>
</head>

  h+='<div class="opt" data-act="unequip" data-slot="'+slot+'"><span>Снять в рюкзак</span></div>';
  h+='<div class="opt" data-act="sell" data-u="'+inst.u+'"><span>Продать</span><span class="c">+'+Math.floor(d.price*0.4)+' руды</span></div>';
 }
 h+='<div class="opt dark" data-act="close">Закрыть</div>';
 ov.innerHTML=h;$('overlay').classList.add('show');}
function doEquip(u){var i,idx=-1;for(i=0;i<S.bag.length;i++)if(S.bag[i].u==u)idx=i;
 if(idx<0)return;var inst=S.bag[idx];var d=ITEMS[inst.id];
 if(S.hero.lvl<d.lvl){toast('Нужен уровень '+d.lvl);return;}
 var old=S.eq[d.slot];S.eq[d.slot]=inst;S.bag.splice(idx,1);
 if(old)S.bag.push(old);
 closeOv();renderAll();save();toast('✔ '+d.n+' надет');}
function doUnequip(slot){var inst=S.eq[slot];if(!inst)return;
 if(S.bag.length>=bagMax()){toast('Рюкзак полон');return;}
 S.eq[slot]=null;S.bag.push(inst);
 closeOv();renderAll();save();toast('Снято: '+ITEMS[inst.id].n);}
function doSell(u){var i,idx=-1;for(i=0;i<S.bag.length;i++)if(S.bag[i].u==u)idx=i;
 if(idx>=0){var inst=S.bag[idx];var gain=Math.floor(ITEMS[inst.id].price*0.4);
  S.ore=Math.min(cap(),S.ore+gain);S.bag.splice(idx,1);
  closeOv();renderAll();save();toast('Продано: +'+gain+' руды');return;}
 var sl;for(sl in S.eq){if(S.eq[sl]&&S.eq[sl].u==u){var g2=Math.floor(ITEMS[S.eq[sl].id].price*0.4);
  S.ore=Math.min(cap(),S.ore+g2);S.eq[sl]=null;
  closeOv();renderAll();save();toast('Продано: +'+g2+' руды');return;}}}
function doDrop(u){var i;for(i=0;i<S.bag.length;i++)if(S.bag[i].u==u){S.bag.splice(i,1);break;}
 closeOv();renderAll();save();toast('Предмет выброшен');}
function renderHero(){var hb=$('heroBox');if(!hb)return;var tab=S.heroTab||'person';var h='';
 h+='<h2>🎒 Герой</h2>';
 h+='<div class="subtabs">';
 h+='<span class="subtab'+(tab==='person'?' active':'')+'" data-act="hertab" data-v="person">👤 Персонаж</span>';
 h+='<span class="subtab'+(tab==='bag'?' active':'')+'" data-act="hertab" data-v="bag">🎒 Рюкзак ('+S.bag.length+'/'+bagMax()+')</span>';
 h+='<span class="subtab'+(tab==='cons'?' active':'')+'" data-act="hertab" data-v="cons">🧪 Расходники</span>';
 h+='<span class="subtab'+(tab==='abil'?' active':'')+'" data-act="hertab" data-v="abil">✨ Способности</span></div>';
 if(tab==='person'){
  h+='<div class="card" style="margin-bottom:10px;"><div style="font-weight:700;color:var(--brz2);">Уровень '+S.hero.lvl+'</div>';
  h+='<div class="xpline"><i style="width:'+Math.min(100,100*S.hero.xp/xpNext())+'%"></i></div>';
  h+='<div class="muted" style="margin-top:2px;">Опыт: '+Math.floor(S.hero.xp)+' / '+xpNext()+'</div>';
  h+='<div class="stchips"><span class="chip">⚔ '+heroAtk()+'</span><span class="chip">🛡 '+heroDef()+'</span><span class="chip">❤ '+heroMaxHp()+'</span></div></div>';
  var slots=['weapon','armor','helm','amulet','ring','boots','pack'];h+='<div class="doll">';
  var i;for(i=0;i<slots.length;i++){var sl=slots[i];var it=S.eq[sl];
   if(it){var d=ITEMS[it.id];
    h+='<div class="slot full" style="border-color:'+RAR[d.rar].c+';" data-act="item" data-src="eq" data-u="'+it.u+'" data-slot="'+sl+'"><span class="ic">'+SLOTI[sl]+'</span><span class="snq" style="color:'+RAR[d.rar].c+'">'+d.n.split(' ')[0]+'</span><span class="snm">'+SLOTN[sl]+'</span></div>';
   }else h+='<div class="slot" data-act="noslot"><span class="ic">'+SLOTI[sl]+'</span><span class="snm">'+SLOTN[sl]+'<br>пусто</span></div>';}
  h+='</div>';
  h+='<div class="muted">Тап по предмету — карточка с «Снять/Продать»</div>';
 }else if(tab==='bag'){
  h+='<div class="bagbar">';
  var fs=[['all','Все'],['weapon','⚔ Оружие'],['armor','🛡 Доспех'],['helm','⛑ Голова'],['boots','👢 Ноги'],['amulet','📿'],['ring','💍'],['pack','🎒']];
  for(i=0;i<fs.length;i++){var on=S.bagF===fs[i][0];
   h+='<span class="fchip'+(on?' active':'')+'" data-act="filter" data-f="'+fs[i][0]+'">'+fs[i][1]+'</span>';}
  h+='</div><div class="bag">';
  var cnt=0;
  for(i=0;i<S.bag.length;i++){var inst=S.bag[i];var d2=ITEMS[inst.id];
   if(S.bagF!=='all'&&d2.slot!==S.bagF)continue;
   h+='<div class="bcell" style="border-color:'+RAR[d2.rar].c+';" data-act="item" data-src="bag" data-u="'+inst.u+'"><span class="ic">'+SLOTI[d2.slot]+'</span><span>'+d2.n.split(' ')[0]+'</span></div>';cnt++;}
  for(i=cnt;i<bagMax()-S.bag.length+cnt&&i<cnt+8;i++)h+='<div class="bcell empty"></div>';
  h+='</div>';
  if(!cnt)h+='<div class="muted">В этой категории пусто. Лут падает в походах, снаряжение — в Лавке.</div>';
 }else if(tab==='cons'){
  h+='<div class="card"><b style="color:var(--brz2)">🧪 Зелья: '+S.pot+'</b><div class="muted">+50% HP в бою. Покупаются в Лавке → Расходники.</div></div>';
  h+='<div class="card"><b style="color:var(--brz2)">📜 Свитки: '+S.scroll+'</b><div class="muted">×2 лут в одном бою. Покупаются в Лавке → Расходники.</div></div>';
 }else{
  h+='<div class="grid2" style="max-width:460px;">';
  for(i=0;i<ABIL.length;i++){var ab=ABIL[i];var owned=!!S.abil[ab.id];
   h+='<div class="itm'+(owned?' locked':'')+'" data-act="'+(owned?'noop':'buyab')+'" data-k="'+ab.id+'">';
   h+='<span class="ic">✨</span><span class="mid"><span class="nm">'+ab.n+'</span><br><span class="st">'+ab.d+'</span></span>';
   h+='<span class="pr">'+(owned?'✔':(ab.price+' '+(ab.cur==='ore'?'руды':'⭐')))+'</span></div>';}
  h+='</div>';}
 hb.innerHTML=h;}
function renderShop(){var sb=$('shopBox');if(!sb)return;
 var cat=S.shopCat||'weapon';
 var cats=[['weapon','⚔ Оружие'],['helm','⛑ Голова'],['armor','🛡 Доспех'],['boots','👢 Ноги'],['amulet','📿 Амулеты'],['ring','💍 Кольца'],['pack','🎒 Рюкзаки'],['cons','🧪 Расходники'],['abil','✨ Способности'],['bm','🌑 Чёрный рынок']];
 var h='<h2>🏪 Лавка</h2><div class="subtabs">';
 var i;for(i=0;i<cats.length;i++){var on=cat===cats[i][0];
  h+='<span class="subtab'+(on?' active':'')+'" data-act="shopcat" data-v="'+cats[i][0]+'">'+cats[i][1]+'</span>';}
 h+='</div>';
 if(cat==='cons'){
  h+='<div class="grid2">';
  h+='<div class="itm" data-act="buypot"><span class="ic">🧪</span><span class="mid"><span class="nm">Зелье лечения</span><br><span class="st">+50% HP в бою · есть: '+S.pot+'</span></span><span class="pr">60 руды</span></div>';
  h+='<div class="itm" data-act="buyscroll"><span class="ic">📜</span><span class="mid"><span class="nm">Свиток добычи</span><br><span class="st">×2 лут в одном бою · есть: '+S.scroll+'</span></span><span class="pr">180 руды</span></div>';
  h+='<div class="itm" data-act="buyspd"><span class="ic">⚡</span><span class="mid"><span class="nm">Пакет ускорений</span><br><span class="st">+5 ⚡ · есть: '+S.spd+'</span></span><span class="pr">120 ⭐</span></div>';
  h+='</div>';
 }else if(cat==='abil'){
  h+='<div class="grid2">';
  for(i=0;i<ABIL.length;i++){var ab=ABIL[i];var owned=!!S.abil[ab.id];
   h+='<div class="itm'+(owned?' locked':'')+'" data-act="'+(owned?'noop':'buyab')+'" data-k="'+ab.id+'">';
   h+='<span class="ic">✨</span><span class="mid"><span class="nm">'+ab.n+'</span><br><span class="st">'+ab.d+'</span></span>';
   h+='<span class="pr">'+(owned?'✔ изучено':(ab.price+' '+(ab.cur==='ore'?'руды':'⭐')))+'</span></div>';}
  h+='</div>';
 }else if(cat==='bm'){
  h+='<div class="muted" style="margin-bottom:8px;">Дорогой курс за ⭐. Редкое снаряжение, которого нет в лавке.</div>';
  h+='<div class="grid2">';
  var bk=['bm1','bm2','bm3','bm4','bm5','bm6','bm7'];
  for(i=0;i<bk.length;i++){var kk=bk[i];var dd=ITEMS[kk];var lk=S.hero.lvl<dd.lvl;
   h+='<div class="itm'+(lk?' locked':'')+'" style="border-color:'+RAR[dd.rar].c+'" data-act="'+(lk?'noop':'buy')+'" data-k="'+kk+'">';
   h+='<span class="ic">'+SLOTI[dd.slot]+'</span><span class="mid"><span class="nm">'+dd.n+'</span><br><span class="st">'+statLine(kk)+' · ур.'+dd.lvl+'</span>';
   if(lk)h+='<div class="lk">🔒 нужен уровень '+dd.lvl+'</div>';
   h+='</span><span class="pr">'+dd.price+' ⭐</span></div>';}
  h+='</div>';
  h+='<div class="muted">Звёзды добываются только в походах.</div>';
 }else{
  var bySlot={};var k;
  for(k in ITEMS){var d=ITEMS[k];if(d.cur!=='ore')continue;if(d.slot!==cat)continue;
   if(!bySlot[cat])bySlot[cat]=[];bySlot[cat].push(k);}
  var keys=bySlot[cat]||[];keys.sort(function(a,b){return ITEMS[a].lvl-ITEMS[b].lvl;});
  h+='<div class="grid2">';
  for(i=0;i<keys.length;i++){k=keys[i];d=ITEMS[k];
   var locked=S.hero.lvl<d.lvl;
   h+='<div class="itm'+(locked?' locked':'')+'" style="border-color:'+RAR[d.rar].c+'" data-act="'+(locked?'noop':'buy')+'" data-k="'+k+'">';
   h+='<span class="ic">'+SLOTI[d.slot]+'</span><span class="mid"><span class="nm">'+d.n+'</span><br><span class="st">'+statLine(k)+' · ур.'+d.lvl+'</span>';
   if(locked)h+='<div class="lk">🔒 нужен уровень '+d.lvl+'</div>';
   h+='</span><span class="pr">'+d.price+' руды</span></div>';}
  h+='</div>';}
 sb.innerHTML=h;}
function buyItem(k){var d=ITEMS[k];
 if(S.hero.lvl<d.lvl){toast('🔒 Нужен уровень '+d.lvl);return;}
 if(S.bag.length>=bagMax()){toast('Рюкзак полон');return;}
 if(d.cur==='ore'){if(S.ore<d.price){toast('Мало руды ('+d.price+')');return;}S.ore-=d.price;}
 else{if(S.star<d.price){toast('Мало звёзд ('+d.price+'⭐)');return;}S.star-=d.price;}
 S.bag.push({u:S.uid++,id:k});
 toast((d.cur==='star'?'🌑 Куплено: ':'Куплено: ')+d.n);
 renderAll();save();}
function buyAb(k){var i;for(i=0;i<ABIL.length;i++){var ab=ABIL[i];if(ab.id!==k)continue;
 if(S.abil[k])return;
 if(ab.cur==='ore'){if(S.ore<ab.price){toast('Мало руды');return;}S.ore-=ab.price;}
 else{if(S.star<ab.price){toast('Мало звёзд');return;}S.star-=ab.price;}
 S.abil[k]=1;toast('✨ Способность изучена: '+ab.n);}
 renderAll();save();}
function renderAll(){
 try{renderStats();}catch(e){showErr(e.message);}
 try{renderGuide();}catch(e){showErr(e.message);}
 try{renderCity();}catch(e){showErr(e.message);}
 try{renderRaid();}catch(e){showErr(e.message);}
 try{renderHero();}catch(e){showErr(e.message);}
 try{renderShop();}catch(e){showErr(e.message);}}
function switchTab(v){
 var tabs=document.querySelectorAll('.tab');var i;
 for(i=0;i<tabs.length;i++)tabs[i].classList.toggle('active',tabs[i].dataset.v===v);
 var views=document.querySelectorAll('section.view');
 for(i=0;i<views.length;i++)views[i].classList.remove('active');
 var sec=$('v_'+v);if(!sec){showErr('Нет секции: '+v);return;}
 sec.classList.add('active');
 try{if(v==='raid')renderRaid();if(v==='hero')renderHero();if(v==='shop')renderShop();}catch(e){showErr(e.message);}}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;
 var act=el.dataset.act;
 if(act==='tab')switchTab(el.dataset.v);
 else if(act==='shopcat'){S.shopCat=el.dataset.v;renderShop();}
 else if(act==='hertab'){S.heroTab=el.dataset.v;renderHero();}
 else if(act==='cell'){var id=el.dataset.id;var b=S.buildings[id];
  if(!b)openBuild(id);
  else if(b.until)openSpeed(id);
  else openUpg(id);}
 else if(act==='buildany')openBuild(null);
 else if(act==='build')doBuild(el.dataset.t,el.dataset.cell);
 else if(act==='upg')doUpg(el.dataset.cell);
 else if(act==='speedup')doSpeed(el.dataset.cell);
 else if(act==='raid')startRaid(el.dataset.k);
 else if(act==='potion')usePotion();
 else if(act==='scrollbtn')useScroll();
 else if(act==='buy')buyItem(el.dataset.k);
 else if(act==='buyab')buyAb(el.dataset.k);
 else if(act==='buypot'){if(S.ore<60){toast('Мало руды');return;}S.ore-=60;S.pot++;renderAll();save();toast('🧪 Зелье куплено');}
 else if(act==='buyscroll'){if(S.ore<180){toast('Мало руды');return;}S.ore-=180;S.scroll++;renderAll();save();toast('📜 Свиток куплен');}
 else if(act==='buyspd'){if(S.star<120){toast('Мало звёзд');return;}S.star-=120;S.spd+=5;renderAll();save();toast('⚡ +5 ускорений');}
 else if(act==='item')openItem(el.dataset.u,el.dataset.src,el.dataset.slot);
 else if(act==='equip')doEquip(el.dataset.u);
 else if(act==='unequip')doUnequip(el.dataset.slot);
 else if(act==='sell')doSell(el.dataset.u);
 else if(act==='drop')doDrop(el.dataset.u);
 else if(act==='filter'){S.bagF=el.dataset.f;renderHero();}
 else if(act==='noslot')toast('Слот пуст — наденьте предмет из рюкзака');
 else if(act==='close')closeOv();
 else if(act==='noop')toast('Недоступно: не хватает ресурсов или уровня');
 else if(act==='share'){var txt='Мой подземный город — этаж '+S.floor+'! Герой ур.'+S.hero.lvl+'. Залетай: t.me/your_bot?start=ref01';
  if(navigator.share)navigator.share({text:txt}).catch(function(){});
  else{if(navigator.clipboard)navigator.clipboard.writeText(txt);toast('Ссылка скопирована');}}
 else if(act==='reset'){if(confirm('Сбросить весь прогресс?')){
  localStorage.removeItem(KEY);S=freshS();renderAll();save();}}
});
function closeOv(){$('overlay').classList.remove('show');}
function tick(){var now=Date.now();
 var id,b,done=false;
 for(id in S.buildings){b=S.buildings[id];
  if(b.until&&now>=b.until){b.until=0;if(b.newLvl){b.lvl=b.newLvl;delete b.newLvl;}
   done=true;addXp(5);toast('✔ '+NAMEB[b.t]+' готова!');}}
 if(done)renderCity();
 S.ore=Math.min(cap(),S.ore+oreRate()*0.25);
 if(Math.random()<0.003&&oreRate()>0){
  var ids=Object.keys(S.buildings);
  if(ids.length){var host=ids[Math.floor(Math.random()*ids.length)];
   var cell=document.querySelector('[data-id="'+host+'"]');
   if(cell&&!cell.querySelector('.spark')){var sp=document.createElement('div');
    sp.className='spark';sp.onclick=function(ev){ev.stopPropagation();
     var bonus=Math.floor(Math.random()*40)+15;
     S.ore=Math.min(cap(),S.ore+bonus);toast('✨ +'+bonus+' руды');
     sp.remove();renderStats();save();};
    cell.appendChild(sp);
    setTimeout(function(){if(sp.parentNode)sp.remove();},90000);}}}
 renderStats();
 if(now-S._sv>20000){S._sv=now;save();}}
setInterval(function(){
 var rb=$('v_raid');if(!rb||!rb.classList.contains('active')||BT)return;
 var busy=Date.now()<S.raidCdUntil;
 var bs=document.querySelectorAll('[data-act="raid"]');var i;
 for(i=0;i<bs.length;i++){
  if(busy){if(!bs[i].disabled){bs[i].disabled=true;
   bs[i].textContent='Отряд в пути ('+Math.ceil((S.raidCdUntil-Date.now())/60000)+' мин)';}}
  else if(bs[i].disabled){bs[i].disabled=false;renderRaid();}}
},1000);
function welcome(){var gone=(Date.now()-S.lastSeen)/3600000;
 if(gone>0.25&&oreRate()>0){
  var mins=Math.min(240,gone*60);
  var got=Math.floor(oreRate()*60*mins);
  if(got>0){S.ore=Math.min(cap(),S.ore+got);
   setTimeout(function(){toast('⛏ Пока вас не было, добыто '+got+' руды');},500);}}
 S.lastSeen=Date.now();}
load();welcome();renderAll();
$('refc').textContent='ref'+(1000+Math.floor(Math.random()*9000));
setInterval(tick,250);
setInterval(function(){S.lastSeen=Date.now();save();},60000);
</script>
</body>
</html>
