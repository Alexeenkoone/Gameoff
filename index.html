/* === СОСТОЯНИЕ === */
function def(){return{ore:150,wag:0,stars:0,energy:3,mana:20,lvl:1,xp:0,pts:0,str:0,end:0,luck:0,army:0,morale:50,floor:1,wins:0,mined:0,bld:[{i:'rath',lv:1,fin:0,cl:0}],pot:2,big:0,inv:[],diary:0,sp:{fire:1,ice:0,light:0,pois:0},story:{ch:1,pg:0},dl:'',stk:0,qd:0,qw:0,qwD:'',ach:{},tab:'city',z:'norm',rr:2,shTab:'con',dealD:'',deal:[],barrelT:0,campT:0,roastT:0,buff:0,bladeLvl:0,helmLvl:0,ring:0,charm:0,greedCh:0,keyCh:0,wt:0,eT:Date.now(),mT:Date.now(),t:Date.now()}}
var SAVE='dd6';
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function wkey(){var d=new Date(),o=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-'+Math.floor((d-o)/6048e5)}
function load(){try{var s=localStorage.getItem(SAVE);if(s)S=JSON.parse(s)}catch(e){}
if(!S||!S.bld)S=def();
if(S.dealD!=dkey(Date.now()))rollDeal();
var dt=Math.min(28800,(Date.now()-(S.t||Date.now()))/1000),o=rate()*dt;
if(o>0){S.ore=Math.min(limit(),S.ore+Math.floor(o*.3));S.wag=Math.min(1000,Math.floor(S.wag+o*.7))}
while(Date.now()-S.eT>=eInt()){S.eT+=eInt();if(S.energy<15)S.energy++}
while(Date.now()-S.mT>=mInt()){S.mT+=mInt();if(S.mana<manaM())S.mana++}}
function save(){S.t=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function rollDeal(){var p=['pot','big','greed','ring','charm','ener','xp','whet'],a=Math.floor(Math.random()*p.length),b=(a+1+Math.floor(Math.random()*(p.length-1)))%p.length;S.deal=[p[a],p[b]];S.dealD=dkey(Date.now())}
/* === ХЕЛПЕРЫ === */
function lv(id){var r=0;S.bld.forEach(function(b){if(b&&b.i==id)r+=b.lv});return r}
function has(id){return lv(id)>0}
function rate(){return .6*lv('mill')+.2*lv('rath')}
function limit(){return 500+250*lv('rath')}
function slots(){return 8+2*lv('rath')}
function eInt(){return Math.max(8,15-lv('cot'))*60000}
function mInt(){return lv('well')>0?12000:20000}
function manaM(){return 20+15*lv('mgr')}
function powM(){return 1+.1*lv('mgr')}
function atk(){var eq=0;S.inv.forEach(function(i){if(i.e&&ITMS[i.id].a)eq+=ITMS[i.id].a});return Math.round((10+2*S.str+S.army*5+10*S.bladeLvl+(S.ring?5:0)+(S.wt||0)+eq)*(1+.05*lv('bs')))}
function hpm(){var ap=0;S.inv.forEach(function(i){if(i.e&&ITMS[i.id].ap)ap+=ITMS[i.id].ap});return 100+15*S.end+S.army*10+20*S.helmLvl+15*lv('ch')+ap}
function morMul(){return Math.max(.8,Math.min(1.33,1+(S.morale-50)/150))}
function gain(x,tr){S.ore=Math.min(limit(),S.ore+x);if(tr)S.mined+=x}
function fmt(n){return Math.floor(n).toLocaleString('ru-RU')}
function addXp(x){S.xp+=x;while(S.xp>=S.lvl*250){S.xp-=S.lvl*250;S.lvl++;S.pts+=3;S.energy=Math.min(15,S.energy+2);toast('УРОВЕНЬ '+S.lvl+'! +3 очка','var(--green)')}}
function toast(txt,c){var w=document.getElementById('tst'),d=document.createElement('div');d.className='toast';d.style.borderColor=c;d.style.color=c;d.textContent=txt;w.appendChild(d);setTimeout(function(){d.remove()},2700)}
function achCheck(){ACHS.forEach(function(a){if(!S.ach[a.id]&&a.ck()){S.ach[a.id]=1;S.stars+=a.pr;toast('🏆 Достижение: '+a.n+' (+'+a.pr+'★)','var(--gold)')}})}
/* === КАРКАС ВКЛАДОК === */
var TABS=[['city','Город'],['raid','Поход'],['hero','Герой'],['magic','Магия'],['shop','Лавка'],['quest','Квесты']];
function setTab(t){S.tab=t;render()}
function header(){return '<div class="pill"><span class="chip">'+SV.pick()+'<b>'+fmt(S.ore)+'</b>/'+fmt(limit())+'</span><span class="chip">'+SV.star()+'<b>'+S.stars+'</b></span><span class="chip">'+SV.bolt()+'<b>'+S.energy+'</b></span><span class="chip">'+SV.drop()+'<b>'+S.mana+'/'+manaM()+'</span><span class="chip">Этаж <b>'+S.floor+'</b></span><span class="chip">Ур. <b>'+S.lvl+'</b></span></div><nav>'+TABS.map(function(t){return '<button class="'+(S.tab==t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'</nav>'}
function render(){var f={city:rCity,raid:rRaid,hero:rHero,magic:rMagic,shop:rShop,quest:rQuest}[S.tab]||rCity;document.getElementById('app').innerHTML=header()+f()}
/* === ГОРОД === */
function rCity(){var now=Date.now(),h='<div class="cityh"><span>⛏ ГОРОД · ЭТАЖ <b>'+S.floor+'</b></span><span>Мораль: <b>'+Math.round(S.morale)+'</b></span></div><div class="panel"><div class="props">';
h+='<div class="prop" onclick="tapBarrel()">'+SV.barrel()+'<span>Бочка</span></div>';
h+='<div class="prop" onclick="tapCamp()">'+SV.campfire()+'<span>Костёр</span></div>';

h+='<div class="prop" onclick="setTab(\'quest\')">'+SV.signpost()+'<span>Указатель</span></div>';
h+='<div class="prop" onclick="setTab(\'raid\')">'+SV.gate()+'<span>Ворота</span></div>';
h+='</div><div class="grid4">';
for(var i=0;i<slots()&&i<16;i++){var b=S.bld[i];

function claimQuest(){if(S.qd||S.mined<200)return;S.qd=1;S.energy=Math.min(15,S.energy+3);gain(150,0);save();render();toast('Квест: +3⚡ +150 руды','var(--green)')}
function claimWeekly(){if(S.qw<10||S.qwD==wkey())return;S.qwD=wkey();S.qw=0;S.energy=Math.min(15,S.energy+5);gain(300,0);save();render();toast('Недельный квест закрыт!','var(--gold)')}
/* === МОДАЛКИ И ТИК === */
function openModal(h){document.getElementById('mod').innerHTML='<div class="ov on" onclick="if(event.target===this)closeModal()"><div class="ovbox">'+h+'</div></div>'}
function closeModal(){document.getElementById('mod').innerHTML='';render()}
function tick(){var t=Date.now(),dt=Math.min(60,(t-lastT)/1000);lastT=t;
S.bld.forEach(function(b){if(b&&b.lv==0&&b.fin&&b.fin<=t){b.lv=1;b.fin=0;toast('Построено: '+(DEF[b.i]||DEF.rath).n,'var(--green)')}});
if(rate()>0){var g=rate()*dt;S.ore=Math.min(limit(),S.ore+g*.3);S.wag=Math.min(1000,S.wag+g*.7)}
while(t-S.eT>=eInt()){S.eT+=eInt();if(S.energy<15)S.energy++}
while(t-S.mT>=mInt()){S.mT+=mInt();if(S.mana<manaM())S.mana++}
achCheck();save();
if(!document.getElementById('mod').innerHTML&&!document.getElementById('ov').classList.contains('on')&&!B)render()}
load();render();
setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){if(document.hidden)save()});
</script></body></html>
